# Sources: UA1 experiment (HEPHY contribution: PM calibration of gondola ECAL);
#          NA36 experiment (SPS heavy-ion TPC, strangeness enhancement / QGP)
# Topics: W/Z discovery; Z EW constraints / stochastic cooling;
