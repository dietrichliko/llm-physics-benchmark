[[questions]]
id         = "exotic_001"
domain     = "Exotic Atoms / Positronium"
difficulty = "medium"
type       = "phenomenological"
question   = """
Positronium (Ps) is an exotic atom formed by an electron and a positron
and is studied by the MBI Exotic Atoms group.

(a) Describe the two ground-state spin configurations of positronium,
    their spectroscopic notation, lifetimes, and dominant decay modes.
    Why do para-Ps and ortho-Ps decay to different numbers of photons?

(b) How does the positronium energy spectrum differ from hydrogen, and
    what makes Ps spectroscopy a clean test of bound-state QED?
"""
reference_answer = """
(a) Para-Ps and ortho-Ps:

Para-Ps (¹S₀, singlet, S = 0):
Lifetime τ ≈ 125 ps; decays to 2γ (two back-to-back 511 keV photons).
The two-photon decay is required by C-symmetry (charge conjugation):
Ps has C = (−1)^{L+S}; for ¹S₀, C = +1, so an even number of photons
(each carrying C = −1) must be emitted.

Ortho-Ps (³S₁, triplet, S = 1):
Lifetime τ ≈ 142 ns; decays to 3γ (continuous spectrum 0–511 keV).
C(³S₁) = −1 requires an odd number of photons.  The extra photon vertex
costs a factor α ≈ 1/137 in amplitude, giving a lifetime ~10³× longer
than para-Ps.

(b) Energy spectrum and QED tests:

Positronium has reduced mass μ = m_e/2 (vs. μ ≈ m_e for hydrogen),
so all energy levels are halved:
  E_n(Ps) = −α² m_e c²/(4n²) = −6.8/n² eV,
and the Bohr radius is doubled (a_{Ps} = 2a_0 = 0.106 nm).

QED tests:
• Hyperfine splitting (1S triplet–singlet): Δν_HFS ≈ 203.389 GHz;
  theoretical predictions include radiative corrections through O(α⁶).
• 1S–2S two-photon transition (~1.23 × 10⁶ GHz): can be measured with
  a frequency-doubled pulsed laser; provides the Ps Rydberg constant.

Ps is a purely leptonic system with no nuclear-structure uncertainty
(unlike hydrogen where finite proton size limits theory at ~7 ppm).
Discrepancies between theory and experiment in Ps therefore signal
purely QED or new-physics effects, making it an exceptionally clean
environment for precision tests.
"""

[[questions]]
id         = "exotic_002"
domain     = "Exotic Atoms / CPT Theorem"
difficulty = "hard"
type       = "phenomenological"
question   = """
The MBI Exotic Atoms group uses antihydrogen to search for symmetry
violation and physics beyond the Standard Model.

(a) State the CPT theorem and explain its physical basis in quantum
    field theory.  What does CPT invariance predict for the properties
    of antihydrogen compared to hydrogen?

(b) Why is a violation of CPT relevant to the matter-antimatter
    asymmetry of the Universe, and through what Standard Model Extension
    (SME) parameters could it be parametrised?
"""
reference_answer = """
(a) CPT theorem and predictions for antihydrogen:

The CPT theorem (Lüders, Pauli, Bell; 1954–57) states that any local,
Lorentz-covariant quantum field theory with a Hermitian Hamiltonian is
invariant under the combined discrete transformation CPT (charge
conjugation C, parity inversion P, time reversal T applied
simultaneously).  Its physical basis: Lorentz invariance + locality +
unitarity together imply CPT symmetry; no consistent local relativistic
QFT can violate CPT while preserving Lorentz invariance.

Predictions for antihydrogen H̄ = (p̄ e⁺):
• Mass: m(H̄) = m(H) exactly.
• 1S–2S transition frequency: ν(H̄) = ν(H) = 2 466 061 413 187 035 Hz.
• Ground-state hyperfine splitting: Δν_HFS(H̄) = Δν_HFS(H) = 1 420 405 751.768 Hz.
• Charge: Q(H̄) = 0 (same as H).
• Gravitational acceleration: predicted equal to g for matter (within GR
  + CPT), though GR itself does not strictly require this.

Any measured difference between H and H̄ in these quantities is a
direct signal of CPT violation.

(b) Matter-antimatter asymmetry and SME parametrisation:

The observed baryon asymmetry η_B ≈ 6×10⁻¹⁰ requires new CP (and
potentially CPT) violation beyond the Standard Model, since the CKM
phase alone is ~10 orders of magnitude too small.  CPT violation could
provide an additional source.

The Standard Model Extension (SME, Kostelecký & Samuel) is the general
effective field theory framework parametrising all possible Lorentz-
and CPT-violating operators consistent with known symmetries.  For the
proton and electron the relevant CPT-odd operators are the axial
4-vector coefficients b_μ^p and b_μ^e (units of energy).  The 1S–2S
measurement of H̄ at precision δν/ν ~ 10⁻¹² constrains a combination
of b_μ^p and b_μ^e at the level of ~10⁻²⁷ GeV — among the most
stringent CPT-violation bounds in any system.
"""

[[questions]]
id         = "exotic_003"
domain     = "Exotic Atoms / Antihydrogen Formation"
difficulty = "hard"
type       = "experimental"
question   = """
Antihydrogen is produced at CERN's Antiproton Decelerator (AD) and
ELENA ring, then used for precision spectroscopy.

(a) Describe the sequence of steps from primary proton beam to trapped
    antihydrogen: antiproton production, deceleration, cooling, and
    recombination with positrons.

(b) What is three-body recombination and why does it tend to produce
    Rydberg (highly excited) antihydrogen?  What challenge does this
    pose for spectroscopy?
"""
reference_answer = """
(a) From proton beam to trapped antihydrogen:

1. Antiproton production: 26 GeV/c protons from the PS strike a
   beryllium or iridium target; p̄ are produced at ~3.5 GeV/c with
   ~10⁻⁵ efficiency per proton.

2. Deceleration — AD (Antiproton Decelerator): stochastic and electron
   cooling reduce the p̄ momentum spread and decelerate them to
   5.3 MeV kinetic energy (100 MeV/c).

3. ELENA (Extra Low ENergy Antiproton ring, 2018–): a small
   synchrotron further decelerates p̄ to 100 keV, reducing emittance
   and enabling more efficient injection into Penning traps.

4. Penning trap capture and cooling: p̄ are injected into a nested
   Penning trap (strong B field + electrostatic well).  Electrons are
   pre-loaded; they thermalise quickly via synchrotron radiation and
   cool the p̄ via Coulomb collisions, reaching T ≲ 100 K in minutes.
   Residual gas pumping maintains UHV (~10⁻¹² mbar).

5. Positron source: ²²Na radioactive source emits β⁺; a Surko-type
   buffer-gas trap moderates and accumulates ~10⁷ e⁺ per cycle.

6. Mixing and recombination: p̄ and e⁺ plasmas are brought together;
   antihydrogen forms via three-body recombination (dominant) or
   radiative recombination.

7. Trapping: H̄ atoms with the correct quantum state (weak-field
   seeking, ΔE/Δ(B) > 0) are trapped in a magnetic minimum (Ioffe–
   Pritchard trap, depth ≈ 0.5 K equivalent).

(b) Three-body recombination and Rydberg H̄:

Three-body recombination: p̄ + e⁺ + e⁺ → H̄* + e⁺.  A second
positron carries away the excess kinetic energy, making the process
exothermic and fast (rate ∝ n²_{e+} T^{−9/2}).  However, energy
conservation requires the released binding energy to be small (carried
by the third particle), so H̄ is predominantly formed in high principal
quantum number states n ≫ 1 (Rydberg H̄).

Spectroscopy challenge:
• Rydberg H̄ must radiatively cascade to the 1S ground state before
  spectroscopy (time scale ~ms to μs depending on n).
• Highly excited H̄ is not trapped (magnetic moment ∝ n², making it
  high-field seeking).
• Field ionisation in the trap electric fields preferentially destroys
  high-n states, so only H̄ that cascade fast enough survive trapping.
Experiments (ALPHA, ASACUSA) operate at T_{e+} ~ 10–30 K to balance
formation rate vs. Rydberg-state fraction, and apply electric field
kicks to strip surviving Rydberg atoms before spectroscopy.
"""

[[questions]]
id         = "exotic_004"
domain     = "Exotic Atoms / Antihydrogen Spectroscopy"
difficulty = "hard"
type       = "experimental"
question   = """
Two complementary spectroscopic methods are used to test CPT with
antihydrogen: 1S–2S two-photon laser spectroscopy and ground-state
hyperfine spectroscopy (HFS).

(a) Explain the principle of two-photon 1S–2S spectroscopy in H̄ and
    identify the main experimental challenges and systematic effects.

(b) How does the ASACUSA cusp-trap approach to HFS spectroscopy differ
    from the in-trap ALPHA method, and what CPT sensitivity is targeted?
"""
reference_answer = """
(a) 1S–2S two-photon spectroscopy (ALPHA-2):

Principle: two counter-propagating 243 nm photons (produced by
frequency-doubling a 486 nm Ti:sapphire laser) drive the
1S(F=1, m_F=−1) → 2S(F=1, m_F=−1) magnetically trapped sublevel
transition.  The counter-propagating geometry cancels the first-order
Doppler shift.  After the two-photon excitation, 2S atoms are detected
via field ionisation (applying a pulsed electric field that ionises 2S
but not 1S atoms) or via annihilation on the trap wall.

Key challenges:
• Low number of trapped H̄ (~1–10 per experimental cycle) → weeks of
  data needed for statistical significance.
• Trapping magnetic field B ≈ 1 T induces a Zeeman shift of the
  chosen sublevel (known, correctable) and mixes states.
• Motional Stark effect: H̄ moving in ∇B experiences an electric field
  E = v × B that slightly broadens the line.
• Laser frequency calibration: 243 nm must be referenced to an optical
  frequency comb locked to a primary frequency standard.

Current ALPHA precision: δν/ν ≈ 2×10⁻¹²  (2021, ~100 trapped H̄).
Target: ~10⁻¹⁵ with laser-cooled H̄, matching hydrogen maser precision.

(b) ASACUSA cusp-trap vs. ALPHA in-trap HFS:

ASACUSA cusp-trap: uses a pair of anti-Helmholtz coils producing a
magnetic cusp (saddle point, B = 0 at centre) to extract a beam of
spin-polarised H̄.  The beam traverses a field-free microwave
interaction region where the HFS transition (F=1 ↔ F=0, ~1.42 GHz)
is driven, then passes through a sextupole spin-selector and a BGO
annihilation detector.  The field-free region eliminates Zeeman
broadening — the dominant systematic in in-trap measurements.
Target: ~1 ppm CPT bound on ΔΔν_HFS = |ν(H̄)−ν(H)|/ν(H).

ALPHA in-trap: microwaves are applied directly inside the trap (B ≈ 1 T);
resonance is observed as trap loss when the driven sublevel becomes
high-field seeking.  Disadvantage: large, inhomogeneous Zeeman shift
limits precision to ~0.1 ppm; advantage: no need for a beam and works
with the same apparatus used for 1S–2S.

SM hydrogen HFS = 1 420 405 751.768 Hz (known to 10⁻¹²); reaching
~10⁻⁶ relative precision in H̄ would probe CPT-violating SME
coefficients b_μ^p at the ~10⁻²⁴ GeV level.
"""

[[questions]]
id         = "exotic_005"
domain     = "Exotic Atoms / Matter-Antimatter Asymmetry"
difficulty = "medium"
type       = "phenomenological"
question   = """
The MBI Exotic Atoms group probes physics beyond the Standard Model at
low energies by searching for matter-antimatter symmetry violation.

(a) State the three Sakharov conditions for baryogenesis and explain
    why the Standard Model satisfies each condition only insufficiently
    to explain the observed baryon asymmetry η_B ≈ 6×10⁻¹⁰.

(b) How do low-energy precision measurements of antihydrogen and
    positronium complement high-energy collider searches for new
    CP-violating physics?
"""
reference_answer = """
(a) Sakharov conditions and SM shortcomings:

Sakharov (1967) showed that any dynamical generation of a net baryon
number from an initially symmetric state requires:

1. Baryon number violation — needed to change net B from zero.
   SM: electroweak sphalerons violate B+L above T_EW ≈ 100 GeV; in
   principle sufficient, but sphaleron transitions are highly suppressed
   at T < T_EW.

2. C and CP violation — needed so that processes creating baryons
   proceed faster than those creating antibaryons.
   SM: C is maximally violated by the weak interaction; CP is violated
   via the CKM phase.  However, the KM phase produces a CP-odd
   combination suppressed by products of quark mass differences:
   J_CP ∝ (m_t²−m_c²)(m_t²−m_u²)…×sin δ_KM ≈ 10⁻²⁰ GeV¹²  —
   ~10 orders of magnitude too small.

3. Departure from thermal equilibrium — needed to prevent inverse
   processes erasing the asymmetry.
   SM: the electroweak phase transition is a smooth crossover for
   m_H = 125 GeV (not first-order), providing insufficient departure
   from equilibrium.

Conclusion: the SM cannot explain η_B ≈ 6×10⁻¹⁰; new sources of
CP (and potentially CPT) violation are required.

(b) Low-energy precision vs. collider searches:

Complementarity:
• Energy-frontier colliders (LHC) search for new CP-violating particles
  produced directly; sensitivity limited by luminosity and background.
• Precision low-energy experiments access virtual effects of very heavy
  new physics via loop corrections or CPT-odd operators.  The reach can
  be equivalent to probing mass scales M_NP ~ m²/δ where δ is the
  fractional precision achieved.  For H̄ spectroscopy at δ ~ 10⁻¹²,
  the probed scale reaches M_NP ~ (m_e)²/(10⁻¹² × m_e) ~ 10⁶ GeV —
  beyond the LHC reach for certain CPT-odd operators.
• Positronium decay-rate asymmetries (e.g. CP-odd angular correlations
  in o-Ps → 3γ) probe C and CP violation in the lepton sector
  independently of hadronic uncertainties, giving clean bounds on
  leptonic new physics.
• Together, these experiments constrain overlapping but distinct sets
  of SME coefficients and exotic interaction operators, providing a
  model-independent map of low-energy BSM physics.
"""

