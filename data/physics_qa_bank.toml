# General Public Outreach  (10 questions)
# Aimed at curious non-physicists: clear explanations, everyday analogies,
# key numbers, and the "why does it matter" perspective.
# Topics: LHC overview; Higgs boson; safety; energy consumption;
#         CERN discoveries; Standard Model; antimatter; dark matter;
#         real-world spin-offs; future accelerators
# ─────────────────────────────────────────────────────────────────────────────

[[questions]]
id         = "public_001"
domain     = "Outreach — Accelerators"
difficulty = "easy"
type       = "outreach"
question   = """
What is the Large Hadron Collider (LHC) at CERN, and how does it work? Please explain it in terms a curious member of the general public can understand, covering what it is, where it is, what it collides, at what energies, and what scientists are trying to learn from it.
"""
reference_answer = """
The Large Hadron Collider is the world's largest and most powerful particle
accelerator. It sits in a circular tunnel 27 kilometres in circumference,
buried about 100 metres underground on the French-Swiss border near Geneva,
Switzerland, and is operated by the European Organisation for Nuclear Research
(CERN).

"Hadron" refers to particles made of quarks — in the LHC this means protons,
which are the positively charged particles found in the nuclei of every atom.
Two beams of protons travel in opposite directions around the ring at
99.9999991% of the speed of light, guided by roughly 9,600 superconducting
magnets chilled to −271 °C (colder than outer space) to maintain very strong
magnetic fields. When the beams are steered to collide head-on, the combined
collision energy reaches 13.6 teraelectronvolts (TeV) — a tiny amount of
energy in everyday terms, but concentrated into a space a billion times
smaller than a grain of sand, recreating the extreme conditions of the Universe
a fraction of a second after the Big Bang.

Four giant detectors (ATLAS, CMS, ALICE, and LHCb) sit at the collision points
and record the particles produced in each collision. Scientists analyse the
data — hundreds of millions of collisions per second — to discover new
particles, test the laws of physics at the smallest scales ever probed, and
search for phenomena such as dark matter that are not yet explained by our
current theories.
"""

[[questions]]
id         = "public_002"
domain     = "Outreach — Higgs Boson"
difficulty = "easy"
type       = "outreach"
question   = """
What is the Higgs boson, why was its discovery in 2012 so important, and what does it tell us about the origin of mass? Please explain for a non-specialist audience.
"""
reference_answer = """
The Higgs boson is a fundamental particle predicted in 1964 by Peter Higgs
and other physicists. It is the quantum of the Higgs field — an invisible
field that permeates all of space. Just as a magnetic field exerts a force on
iron filings, the Higgs field exerts a kind of "drag" on certain particles as
they move through it. The more strongly a particle interacts with the Higgs
field, the more sluggish it is — and that sluggishness is what we experience
as mass. Particles such as photons (light) do not interact with the Higgs
field at all, which is why they have no mass and travel at the speed of light.
Electrons and quarks do interact with it, giving them the mass that makes
atoms — and therefore all ordinary matter — possible.

For nearly fifty years the Higgs boson was the one missing piece of the
Standard Model of particle physics, the theory describing all known
fundamental particles and forces. Without it the whole mathematical framework
would be inconsistent. On 4 July 2012, the ATLAS and CMS experiments at the
LHC announced its discovery, with a mass of about 125 GeV/c² (roughly 133
times the mass of a proton). Peter Higgs and François Englert were awarded
the Nobel Prize in Physics in 2013.

The discovery confirmed that the mechanism giving particles their mass is
correct, completed the Standard Model, and opened a new window for precision
measurements — since even tiny deviations in the Higgs particle's properties
could reveal physics beyond our current understanding.
"""

[[questions]]
id         = "public_003"
domain     = "Outreach — LHC Safety"
difficulty = "easy"
type       = "outreach"
question   = """
There have been public concerns that the LHC could create dangerous black holes or other catastrophic phenomena. Are these fears justified? Please explain the science behind LHC safety for a general audience.
"""
reference_answer = """
The short answer is: no, there is no danger. This has been rigorously studied
by independent physicists and confirmed by two comprehensive CERN Safety
Assessment Group reports (2003 and 2008).

Could the LHC create black holes? In some exotic theoretical models, tiny
microscopic black holes could in principle form at very high energies. However,
even if they were created, they would be so extraordinarily small — carrying
far less energy than a single mosquito's flight — that they would evaporate
almost instantaneously through a process called Hawking radiation before they
could interact with anything. Crucially, nature already runs this experiment
for us: cosmic rays — particles arriving from space — strike Earth's atmosphere
and each other with energies far exceeding those of the LHC, and have done so
for billions of years across the entire Universe. If such collisions were
dangerous, planets, stars, and neutron stars throughout the cosmos would long
since have been destroyed.

Could strangelets (hypothetical clumps of "strange" matter) cause a chain
reaction? Detailed analysis shows strangelets, if they exist at all, would
not be stable under the conditions at the LHC, and again, cosmic-ray
collisions make this argument moot.

CERN takes safety very seriously. The LHC safety studies were reviewed by
independent groups of physicists from around the world, all of whom reached
the same conclusion: the LHC poses no conceivable threat to Earth.
"""

[[questions]]
id         = "public_004"
domain     = "Outreach — Energy and Sustainability"
difficulty = "easy"
type       = "outreach"
question   = """
How much electricity does the LHC use, and how does CERN address the environmental impact of running such a large scientific facility? Put the energy consumption in everyday context.
"""
reference_answer = """
CERN as a whole consumes around 1.3 terawatt-hours (TWh) of electricity per
year when running at full capacity, and about 0.6 TWh during winter shutdown
periods. The LHC itself accounts for roughly a third of that — approximately
400–500 gigawatt-hours per year. To put this in perspective:

• It is roughly equivalent to the annual electricity consumption of about
  120,000 European households.
• It is less than 0.3% of Switzerland's total electricity consumption.
• A single full-capacity LHC run year consumes about as much energy as
  the city of Geneva uses in a few months.

CERN draws its power from the French electrical grid (Électricité de France),
which is predominantly nuclear, giving it a relatively low carbon footprint
per kilowatt-hour compared to grids that rely heavily on fossil fuels. During
winter, when electricity demand and prices are highest across Europe, CERN
reduces or pauses operations to ease the load on the grid — a practice called
"winter shutdown."

CERN has also launched an environmental sustainability programme with targets
to reduce energy consumption by improving cryogenic efficiency (the
superconducting magnets require enormous cooling power), recovering waste heat,
and transitioning its vehicle fleet to electric. The Future Circular Collider
(FCC) studies explicitly include sustainability as a design criterion, exploring
geothermal and other renewable energy sources. Scientists at CERN are well
aware that big science comes with a responsibility to minimise its footprint.
"""

[[questions]]
id         = "public_005"
domain     = "Outreach — CERN Discoveries"
difficulty = "easy"
type       = "outreach"
question   = """
What are the most important scientific discoveries that have come out of CERN? Beyond the Higgs boson, what has CERN contributed to our understanding of the Universe — and to everyday life?
"""
reference_answer = """
CERN has produced a remarkable catalogue of discoveries since it was founded
in 1954:

**Fundamental particle discoveries:** The W and Z bosons (discovered at the
SppS collider in 1983, Nobel Prize 1984), which carry the weak nuclear force
responsible for radioactive decay. CERN experiments have also discovered
dozens of hadrons — composite particles made of quarks.

**Confirmation of the quark model:** Experiments at CERN in the 1970s and 80s
provided decisive evidence that protons and neutrons are themselves built of
quarks and gluons, cementing the Standard Model of particle physics.

**Precision electroweak physics:** The LEP collider (1989–2000) measured the
properties of the Z boson with extraordinary precision, established that there
are exactly three generations of neutrinos, and tightly constrained the Standard
Model, even predicting the likely mass range of the top quark and Higgs boson
before they were directly observed.

**Matter-antimatter asymmetry:** LHCb has made precise measurements of CP
violation — the subtle difference between matter and antimatter — that may
eventually explain why the Universe is made of matter at all.

**Everyday spin-offs:** Perhaps the most world-changing CERN invention was the
World Wide Web, developed by Tim Berners-Lee at CERN in 1989 to share research
data. Medical technology also benefits enormously: the ion therapy techniques
used to treat tumours with proton and carbon beams grew directly from
accelerator physics. Positron Emission Tomography (PET) scanners use
antiparticles first studied at accelerators. Superconducting magnet technology
developed for the LHC is finding uses in MRI machines and energy storage.
"""

[[questions]]
id         = "public_006"
domain     = "Outreach — Standard Model"
difficulty = "easy"
type       = "outreach"
question   = """
What is the Standard Model of particle physics? Explain it in plain language: what it describes, what the fundamental particles are, and what it leaves unexplained.
"""
reference_answer = """
The Standard Model is particle physics' best current theory of the fundamental
building blocks of the Universe and the forces that act between them. Developed
through the 1960s and 1970s, it has been tested to extraordinary precision and
has never been contradicted by experiment.

**The matter particles (fermions):** All ordinary matter is built from just
twelve fundamental particles. Six "quarks" (up, down, charm, strange, top,
bottom) combine in groups of three to form protons and neutrons inside atomic
nuclei. Six "leptons" include the electron (which orbits the nucleus) and three
types of neutrino (ghostly particles that barely interact with anything). These
twelve particles come in three "generations" — heavier copies of each other —
though only the lightest generation makes up everyday matter.

**The force carriers (bosons):** Forces are transmitted by particles too.
The photon carries electromagnetism (light). The W and Z bosons carry the weak
force (responsible for radioactive decay). Gluons carry the strong force that
binds quarks together inside protons. The Higgs boson is responsible for giving
other particles their mass.

**What the Standard Model does NOT explain:**
• It says nothing about gravity (described instead by Einstein's General
  Relativity).
• It does not explain dark matter or dark energy, which together make up
  about 95% of the Universe.
• It does not explain why there is more matter than antimatter.
• It has 19 free parameters (particle masses, coupling strengths) that must
  be measured rather than predicted.
For these reasons, physicists are confident the Standard Model is incomplete,
and continue to search for the deeper theory that goes beyond it.
"""

[[questions]]
id         = "public_007"
domain     = "Outreach — Antimatter"
difficulty = "easy"
type       = "outreach"
question   = """
What is antimatter, why does it matter to science, and why is the Universe not made equally of matter and antimatter? Explain for a general audience.
"""
reference_answer = """
Every particle of matter has a corresponding "antiparticle" with the same mass
but opposite electric charge. The antiparticle of the electron is the positron
(positive charge); the antiproton is the antimatter counterpart of the proton.
When a particle meets its antiparticle they annihilate each other in a burst
of pure energy (usually gamma rays), following Einstein's famous E = mc².

Antimatter is not science fiction — it is real and routinely produced at CERN
and in hospitals. PET scanners in hospitals exploit the fact that a radioactive
tracer emits positrons, which annihilate with electrons in the body and produce
detectable gamma rays. CERN's ALPHA experiment has created and trapped atoms of
antihydrogen (an antiproton orbited by a positron) to test whether antimatter
obeys the same laws of physics as matter — a test called CPT symmetry.

The great mystery: when the Universe was born in the Big Bang, theory predicts
that matter and antimatter should have been created in exactly equal amounts.
If that were true, they would have annihilated each other completely, leaving
nothing but light — and we would not exist. Yet the observable Universe is made
almost entirely of matter. Something — some subtle difference in the way matter
and antimatter behave — must have tipped the balance. This difference is called
"CP violation" and has been measured in kaons and B-mesons, but the amount
observed so far is far too small to explain our matter-dominated Universe.
Discovering the full explanation is one of the deepest unsolved problems in
all of science.
"""

[[questions]]
id         = "public_008"
domain     = "Outreach — Dark Matter and Dark Energy"
difficulty = "easy"
type       = "outreach"
question   = """
What are dark matter and dark energy? Why do scientists think they exist, and what are physicists at CERN and elsewhere doing to detect or understand them?
"""
reference_answer = """
Everything we can see — stars, galaxies, gas, planets, you — accounts for only
about 5% of the total content of the Universe. The rest is invisible:
approximately 27% is "dark matter" and 68% is "dark energy."

**Dark matter** is matter that does not emit, absorb, or reflect light, so we
cannot see it directly. We know it exists because of its gravitational effects:
galaxies rotate too fast to be held together by the gravity of their visible
stars alone — they need additional unseen mass. Galaxy clusters bend light from
objects behind them (gravitational lensing) far more than their visible matter
can account for. The leading candidate is a new type of fundamental particle —
a Weakly Interacting Massive Particle (WIMP) — that interacts only through
gravity and the weak force. The LHC actively searches for such particles: if
two protons collide and produce a WIMP that escapes invisibly, it would leave a
characteristic "missing energy" signature in detectors. Underground laboratories
also search for WIMPs directly when they occasionally collide with atomic nuclei.

**Dark energy** is even more mysterious. In 1998, observations of distant
supernovae showed that the expansion of the Universe is not slowing down — it
is accelerating. Something is pushing space apart. This "something" is dark
energy, and it may be Einstein's cosmological constant (an energy inherent to
empty space) or something more exotic. Particle physics is connected because the
quantum vacuum should contribute to dark energy, but theoretical predictions
differ from observations by 120 orders of magnitude — the worst discrepancy
in all of physics. Understanding dark energy is one of the greatest challenges
for both particle physics and cosmology.
"""

[[questions]]
id         = "public_009"
domain     = "Outreach — Real-World Applications"
difficulty = "easy"
type       = "outreach"
question   = """
Particle physics research can seem very far removed from everyday life. What practical technologies and medical applications have emerged from research at CERN and other particle physics laboratories?
"""
reference_answer = """
Particle physics has contributed a surprisingly wide range of technologies that
touch everyday life:

**The World Wide Web:** Tim Berners-Lee invented the Web at CERN in 1989 to
help physicists share data across computers worldwide. What started as a tool
for scientists became the global communications infrastructure used by billions.

**Medical imaging:** PET (Positron Emission Tomography) scanners detect
cancer and brain activity using positrons — antimatter electrons — produced
by radioactive tracers. The detector technology was refined through decades of
particle physics. Similarly, the algorithms used to reconstruct particle tracks
in collider detectors are now applied to medical imaging reconstruction.

**Cancer treatment:** Hadron therapy (proton therapy and carbon-ion therapy)
uses beams of protons or heavier ions to destroy tumours with high precision,
depositing energy at a specific depth (the Bragg peak) and sparing surrounding
healthy tissue. This technique is a direct application of the accelerator and
beam physics developed for high-energy experiments. There are now over 100
hadron therapy centres worldwide.

**Superconducting magnets and MRI:** Superconducting magnet technology
essential for the LHC is closely related to the magnets in MRI (Magnetic
Resonance Imaging) machines used in hospitals daily.

**Radiation detectors:** Silicon pixel detectors developed for particle
physics experiments are used in digital X-ray imaging and as sensors in
smartphones. The Medipix chip, developed at CERN, can produce colour X-ray
images distinguishing different tissues and materials.

**Computing and grid technology:** The vast data volumes of LHC experiments
drove the development of the Worldwide LHC Computing Grid — a distributed
computing network linking 170 facilities in 42 countries — pioneering
technologies now used in cloud computing.
"""

[[questions]]
id         = "public_010"
domain     = "Outreach — Future of Particle Physics"
difficulty = "easy"
type       = "outreach"
question   = """
What comes after the LHC? Describe the proposed next generation of particle accelerators and what new physics questions they aim to answer. What is the Future Circular Collider (FCC), and when might it be built?
"""
reference_answer = """
The physics programme of the LHC continues until around 2041 in its
High-Luminosity LHC (HL-LHC) phase, which will deliver ten times more
collisions to sharpen measurements of the Higgs boson and search for rare
processes. But the community is already planning the machines that will
follow.

**Future Circular Collider (FCC):** CERN's leading proposal is a new
100-kilometre tunnel (nearly four times longer than the LHC) that would first
operate as a high-precision electron–positron collider (FCC-ee, sometimes
called TLEP), acting as a "Higgs and Z factory" to measure the Higgs boson
and other particles with extraordinary precision. In a second stage it would
host a proton–proton collider (FCC-hh) reaching energies of 100 TeV —
roughly eight times the LHC energy — potentially discovering entirely new
particles too heavy for the LHC. The FCC is estimated to cost around
€20 billion and would be a decades-long international project, with operations
possibly beginning in the 2040s.

**International Linear Collider (ILC):** Japan has proposed a 20–50 km
straight electron–positron collider to study the Higgs boson in a clean
environment, though it awaits final government approval.

**Muon collider:** A more futuristic idea is a collider using muons (heavier
cousins of electrons). Muons can reach very high energies without losing as
much energy to radiation, and could fit in a smaller ring than proton
colliders at equivalent energy. Intense research and development is underway.

The open scientific questions that motivate these projects include: What
exactly is the Higgs boson and are its properties exactly as the Standard
Model predicts? What is dark matter? Why is there more matter than antimatter?
Are there new forces or dimensions of space? Answering these questions will
require the next generation of machines, international collaboration, and the
ingenuity of physicists worldwide.
"""

# ─────────────────────────────────────────────────────────────────────────────
# Graduate-Level Basic Physics  (10 questions)
# Target audience: first/second-year PhD students in particle physics or
# theoretical physics.  Covers the core theory toolkit: gauge structure,
# QCD, spontaneous symmetry breaking, QFT methods, GR, QM foundations,
# renormalisation group, hierarchy problem, neutrino masses, black holes.
# ─────────────────────────────────────────────────────────────────────────────

[[questions]]
id         = "basic_001"
domain     = "Standard Model — Gauge Structure"
difficulty = "medium"
type       = "theory"
question   = """
The Standard Model is built on a gauge symmetry group. (a) State the full SM gauge group and identify the gauge boson(s) associated with each factor. (b) Explain how the electroweak gauge symmetry SU(2)_L × U(1)_Y is spontaneously broken to U(1)_em and which gauge bosons acquire mass. (c) Using the Gell-Mann–Nishijima relation Q = T₃ + Y/2, work out the electric charges of the members of the left-handed quark doublet Q_L = (u_L, d_L)^T, given their weak isospin quantum numbers and hypercharge Y = +1/3.
"""
reference_answer = """
(a) SM gauge group: SU(3)_C × SU(2)_L × U(1)_Y.
  — SU(3)_C (colour): 8 massless gluons g^a (a=1…8), generators T^a = λ^a/2
    (Gell-Mann matrices); mediates the strong force.
  — SU(2)_L (weak isospin): 3 bosons W^1, W^2, W^3, couples only to
    left-handed fermion doublets.
  — U(1)_Y (hypercharge): 1 boson B^μ.

(b) The Higgs field Φ (SU(2)_L doublet, Y=+1) acquires a vacuum expectation
value ⟨Φ⟩ = (0, v/√2)^T with v ≈ 246 GeV, breaking SU(2)_L × U(1)_Y → U(1)_em.
The three generators broken are T_1, T_2, and (T_3 − Y/2 from U(1)_Y); their
corresponding linear combinations of W^{1,2,3} and B acquire mass:
  W±_μ = (W^1_μ ∓ iW^2_μ)/√2   M_W = ½gv ≈ 80.4 GeV
  Z_μ  = W^3_μ cosθ_W − B_μ sinθ_W   M_Z = M_W/cosθ_W ≈ 91.2 GeV
The orthogonal combination A_μ = W^3_μ sinθ_W + B_μ cosθ_W remains massless
(the photon), with sinθ_W ≡ g'/√(g²+g'²) ≈ 0.481 (sin²θ_W ≈ 0.231).
The eight gluons and the photon remain massless (unbroken generators).

(c) Gell-Mann–Nishijima: Q = T₃ + Y/2.
For Q_L = (u_L, d_L)^T, hypercharge Y(Q_L) = +1/3.
  u_L: T₃ = +1/2 → Q(u_L) = +1/2 + 1/6 = +2/3  ✓
  d_L: T₃ = −1/2 → Q(d_L) = −1/2 + 1/6 = −1/3  ✓
Right-handed singlets: u_R has Y = +4/3, d_R has Y = −2/3 (T₃ = 0 for singlets),
giving Q = +2/3 and −1/3 consistently.
"""

[[questions]]
id         = "basic_002"
domain     = "Standard Model — QCD"
difficulty = "hard"
type       = "theory"
question   = """
Quantum chromodynamics (QCD) displays two apparently contradictory properties: asymptotic freedom at short distances and confinement at long distances. (a) Define both and cite the key experimental evidence for each. (b) Derive (schematically) the one-loop QCD beta function and explain why its sign differs from that of QED, leading to asymptotic freedom. (c) Define the confinement scale Λ_QCD, estimate its numerical value, and explain qualitatively why the colour flux-tube picture prevents free quarks from ever being observed.
"""
reference_answer = """
(a) Asymptotic freedom: αs(μ) → 0 as μ → ∞; quarks inside a proton behave
as nearly free partons at high momentum transfer Q². Evidence: the approximate
Bjorken scaling seen in deep-inelastic scattering (DIS) and its logarithmic
DGLAP evolution violations are quantitatively described by decreasing αs(Q).
Confinement: colour-charged objects are always bound in colour-singlet hadrons;
no free quark or gluon has ever been observed. Evidence: no fractional-charge
tracks in any detector; quark-model hadron spectroscopy; lattice QCD shows a
linearly rising qq̄ potential V(r) ≈ κr at large r.

(b) The one-loop beta function: μ dαs/dμ = β(αs) = −(b₀/2π)αs² + O(αs³)
where b₀ = (11C_A − 4T_F n_f)/3.
  — C_A = 3 (adjoint Casimir for SU(3), from gluon self-interactions).
  — T_F = 1/2, n_f = number of active quark flavours.
  b₀ = 11 − 2n_f/3; for n_f ≤ 16: b₀ > 0, so β < 0 → asymptotic freedom.
The 11C_A term comes from the triple-gluon and four-gluon vertices (unique to
non-abelian gauge theories; absent in QED). Gluon loops antiscreen colour
charge: the colour field of a quark is concentrated at short distances, unlike
the electric field in QED which is screened by fermion loop polarisation. In
QED only fermion loops contribute, giving b₀^{QED} = −4T_F n_f/3 < 0, so
α_em grows with energy (Landau pole) instead of shrinking.

(c) Integrating the one-loop RGE:
αs(Q) = 2π / [b₀ ln(Q/Λ_QCD)]
Λ_QCD is defined as the scale where αs diverges (confinement onset):
Λ_QCD = M_Z exp(−2π / [b₀ αs(M_Z)]) ≈ 200–300 MeV (for n_f=5, αs(M_Z)≈0.118).
This corresponds to a distance r ~ ħc/Λ_QCD ~ 0.7 fm — the proton size.
Physically: as two quarks separate, the colour flux lines (unlike electric
field lines) are squeezed by gluon self-attraction into a narrow flux tube of
constant energy per unit length (string tension κ ≈ 1 GeV/fm ≈ 0.18 GeV²).
The potential grows linearly: V(r) ≈ κr. When stored energy equals ~2m_had,
a new qq̄ pair pops out of the vacuum — hadronisation — and free quarks are
never reached.
"""

[[questions]]
id         = "basic_003"
domain     = "Standard Model — Higgs Mechanism"
difficulty = "hard"
type       = "theory"
question   = """
Explain spontaneous electroweak symmetry breaking and the Brout–Englert–Higgs mechanism. (a) Why cannot W and Z masses be introduced as explicit mass terms in the SM Lagrangian? (b) Write the Higgs potential V(Φ) for an SU(2)_L doublet and identify the vacuum expectation value v in terms of the potential parameters and the Fermi constant G_F. (c) State Goldstone's theorem and explain how the three Goldstone bosons produced by SU(2)_L × U(1)_Y breaking are "eaten" to provide the longitudinal polarisations of the W± and Z. (d) What sets the mass of the physical Higgs boson h?
"""
reference_answer = """
(a) An explicit mass term ½M²W_μW^μ for a gauge boson violates the local gauge
symmetry of the Lagrangian. In a non-abelian theory this breaks
renormalisability: the longitudinal polarisation vector ε^μ_L ∝ k^μ/M grows
with energy, making amplitudes such as WW→WW diverge as s/M_W² without the
cancellations that gauge invariance guarantees. Adding mass terms by hand also
breaks unitarity of the S-matrix at √s ~ 1 TeV. The Higgs mechanism generates
masses dynamically while preserving gauge invariance in the full Lagrangian.

(b) Higgs potential: V(Φ) = −μ²(Φ†Φ) + λ(Φ†Φ)²
For μ² > 0, λ > 0: the minimum is a circle |Φ|² = μ²/(2λ) ≡ v²/2.
In unitary gauge Φ = (0, (v+h)/√2)^T.
The vev v is related to the Fermi constant by G_F/√2 = 1/(2v²):
v = (√2 G_F)^{−1/2} ≈ 246 GeV.

(c) Goldstone's theorem: if a global continuous symmetry with N generators is
spontaneously broken to a subgroup with n generators, there are N−n massless
scalar Goldstone bosons. SU(2)_L × U(1)_Y has 4 generators; U(1)_em has 1;
hence 3 Goldstone bosons appear in the scalar sector of the broken phase.
In the full gauge theory these scalars are unphysical: in unitary gauge they
vanish from the Lagrangian and reappear as the longitudinal (helicity-0)
degrees of freedom of the massive W⁺, W⁻, Z. A massless spin-1 boson has 2
transverse polarisations; a massive spin-1 boson has 3; the extra degree of
freedom is the "eaten" Goldstone. The photon remains massless with 2
polarisations because U(1)_em is unbroken.

(d) Physical Higgs mass: expanding V around the minimum gives
m_h² = 2μ² = 2λv².
The quartic self-coupling λ = m_h²/(2v²) ≈ 0.13 for m_h = 125.25 GeV.
Unlike M_W = ½gv and M_Z = ½√(g²+g'²)v (which are determined by v and
measured gauge couplings), m_h depends on λ — a free parameter that must be
measured. The smallness of m_h relative to the Planck scale is the hierarchy
problem.
"""

[[questions]]
id         = "basic_004"
domain     = "Quantum Field Theory — Feynman Diagrams"
difficulty = "medium"
type       = "theory"
question   = """
Feynman diagrams are the central calculational tool of perturbative quantum field theory. (a) Explain what a Feynman diagram represents physically and mathematically: its relation to the S-matrix, the role of external and internal lines, and why the coupling constant controls the perturbative expansion. (b) State the QED Feynman rules (electron propagator, photon propagator, vertex factor) and write the leading-order amplitude for Compton scattering γe⁻→γe⁻. (c) Explain why loop diagrams lead to ultraviolet (UV) divergences and what renormalisation does to render physical predictions finite.
"""
reference_answer = """
(a) The S-matrix element ⟨f|S|i⟩ = ⟨f|i⟩ + i(2π)⁴δ⁴(p_f−p_i)M gives the
scattering amplitude M from which cross sections σ ∝ |M|² are derived.
Expanding the time-ordered exponential S = T exp(i∫ℒ_int d⁴x) in powers of
the coupling constant e (for QED), each term is a sum over Feynman diagrams of
a given order in e. Diagrammatically:
  — External lines (incoming/outgoing): on-shell particles; contribute
    spinors u(p), v(p), polarisation vectors ε_μ(k).
  — Internal lines (propagators): virtual (off-shell) particles; carry all
    4-momenta allowed by the vertices, integrated over at loops.
  — Vertices: each carries a factor of the coupling; n vertices → order e^n.
The expansion is valid when e²/4π = α ≈ 1/137 ≪ 1, so higher-order diagrams
give smaller corrections.

(b) QED Feynman rules (in Feynman gauge):
  Electron propagator:   i(p̸+m)/(p²−m²+iε)
  Photon propagator:    −ig_μν/(k²+iε)
  QED vertex:           −ieγ^μ
Compton scattering γ(k,ε) + e⁻(p,s) → γ(k′,ε′) + e⁻(p′,s′) has two
tree-level diagrams (s- and u-channels):
iM = (−ie)² ε′*_ν ε_μ ū(p′)
  × [γ^ν (p̸+k̸+m)/((p+k)²−m²) γ^μ
   + γ^μ (p̸−k̸′+m)/((p−k′)²−m²) γ^ν] u(p)
Squaring and summing over spins and photon polarisations gives the
Klein–Nishina formula for the differential cross section.

(c) At one loop, propagator momenta are integrated over all values: ∫d⁴ℓ f(ℓ).
For large ℓ, propagators fall as ∼1/ℓ², so ∫d⁴ℓ/ℓ⁴ ∼ ∫dℓ/ℓ → diverges
logarithmically (log divergence) or worse. For example, the fermion
self-energy Σ(p) ∼ Λ² (quadratic) and the photon vacuum polarisation
Π(q²) ∼ ln Λ in QED. Renormalisation introduces counterterms in the
Lagrangian (rescaling fields and redefining mass and coupling: ψ₀ = Z_ψ^{1/2}ψ,
m₀ = m + δm, e₀ = μ^{ε}Z_e e) chosen to absorb all UV divergences order by
order. Physical predictions expressed in terms of the renormalised mass and
charge m, e (measured at scale μ) are finite and μ-independent. QED is
renormalisable because the set of counterterms matches the operators already
present in the original Lagrangian.
"""

[[questions]]
id         = "basic_005"
domain     = "General Relativity — Field Equations and Black Holes"
difficulty = "hard"
type       = "theory"
question   = """
(a) State Einstein's field equations and explain the physical meaning of each term. (b) Derive (or state and explain) the Schwarzschild metric for a spherically symmetric, static vacuum spacetime, and identify the event horizon and its physical significance. (c) Explain how gravitational wave solutions arise from linearised GR and what physical parameters of a compact binary — chirp mass ℳ and luminosity distance d_L — can be extracted from the observed strain waveform h(t).
"""
reference_answer = """
(a) Einstein's field equations (with cosmological constant):
  G_μν + Λg_μν = (8πG/c⁴) T_μν
  G_μν = R_μν − ½g_μν R  (Einstein tensor)
  R_μν = R^ρ_{μρν}        (Ricci tensor, contraction of Riemann tensor)
  R = g^μν R_μν           (Ricci scalar)
  T_μν: energy-momentum tensor (density, flux, pressure, stress of matter/energy)
  Λ: cosmological constant (dark energy)
"Spacetime tells matter how to move; matter tells spacetime how to curve."
In the Newtonian limit, the 00-component reduces to ∇²Φ = 4πGρ (Poisson).

(b) Outside a spherical mass M (vacuum, T_μν=0, Λ=0), the unique solution is:
  ds² = −(1−r_s/r)c²dt² + (1−r_s/r)^{−1}dr² + r²(dθ²+sin²θ dφ²)
where r_s = 2GM/c² (Schwarzschild radius). For the Sun r_s≈3 km; for Earth
r_s≈9 mm. The metric coefficient g_tt vanishes at r=r_s: at this surface the
gravitational redshift z→∞, and the escape velocity equals c. The event horizon
r=r_s is not a physical singularity (the Kretschner scalar R_μνρσR^μνρσ is
finite there; only at r=0 is there a true singularity). It is however a causal
boundary: no signal from r<r_s can reach r>r_s, making the interior
classically inaccessible to external observers. A freely falling observer
crosses r_s without noticing locally (equivalence principle) but cannot
subsequently escape.

(c) Linearised GR: g_μν = η_μν + h_μν, |h|≪1. In transverse-traceless (TT)
gauge the vacuum field equations reduce to □h^{TT}_{ij} = 0 — wave equation
for GWs propagating at c with two independent polarisations h_+ and h_×.
For a quasi-circular compact binary at luminosity distance d_L, the dominant
quadrupole radiation gives the leading-order (inspiral) strain:
  h(t) ∝ (Gℳ/c²)^{5/3} (πf_GW)^{2/3} / d_L
where ℳ = (m₁m₂)^{3/5}/(m₁+m₂)^{1/5} is the chirp mass and f_GW = 2f_orbital.
The frequency evolution: df_GW/dt = (96/5)π^{8/3}(Gℳ/c³)^{5/3} f_GW^{11/3}
allows ℳ to be measured from the chirp rate independently of d_L.
The amplitude h ∝ ℳ^{5/3}/d_L then gives d_L — making binary mergers
"standard sirens" requiring no external distance calibration.
"""

[[questions]]
id         = "basic_006"
domain     = "Quantum Mechanics — Uncertainty and Measurement"
difficulty = "medium"
type       = "theory"
question   = """
(a) Derive the Heisenberg uncertainty relation ΔxΔp ≥ ħ/2 from the canonical commutation relation [x̂,p̂]=iħ using the Robertson–Schrödinger inequality. (b) Explain the double-slit experiment: how interference arises from the wavefunction, and why obtaining which-path information destroys the interference pattern — connect this to the concept of entanglement with the environment. (c) Describe the quantum measurement problem and compare the Copenhagen interpretation, Everett's many-worlds, and the decoherence approach, noting what problem each does and does not solve.
"""
reference_answer = """
(a) Robertson inequality: for any two Hermitian operators Â, B̂ and any state |ψ⟩,
  (ΔA)(ΔB) ≥ ½|⟨[Â,B̂]⟩|
Proof: let |f⟩=(Â−⟨A⟩)|ψ⟩, |g⟩=(B̂−⟨B⟩)|ψ⟩. Cauchy-Schwarz: ⟨f|f⟩⟨g|g⟩≥|⟨f|g⟩|².
Write ⟨f|g⟩ = ½⟨{Â,B̂}⟩−⟨A⟩⟨B⟩ + ½⟨[Â,B̂]⟩ (anti-commutator real, commutator
imaginary). Taking the modulus: (ΔA)²(ΔB)² ≥ ¼|⟨[Â,B̂]⟩|².
For [x̂,p̂]=iħ: ΔxΔp ≥ ħ/2.
This is not about measurement disturbance but an intrinsic property of quantum
states: no state can simultaneously be a sharp eigenstate of both x̂ and p̂.

(b) A particle passes two slits; the wavefunction is |ψ⟩=|1⟩+|2⟩ (unnormalised).
The probability to land at position y on the screen is P(y)=|⟨y|ψ⟩|²=|ψ₁(y)+ψ₂(y)|²,
which includes the cross term 2Re(ψ₁*ψ₂) — the interference fringes.
If a which-path detector records which slit: the joint state becomes
|ψ⟩=|1⟩|D₁⟩+|2⟩|D₂⟩. Tracing over the detector (environment):
ρ_screen = |⟨D₁|D₂⟩|² (cross term) + diagonal terms.
If |D₁⟩ and |D₂⟩ are orthogonal (perfect which-path information), the
interference term vanishes: the particle behaves classically. Complementarity:
interference and which-path information are mutually exclusive.

(c) The measurement problem: Schrödinger's equation is linear and unitary,
mapping pure states to pure states. Yet observation yields a definite outcome
with probability |α|² (Born rule) — an apparent collapse. The problem is to
reconcile deterministic evolution with probabilistic outcomes.
  — Copenhagen: wavefunction collapse is a fundamental postulate applied at
    the quantum/classical boundary; the wavefunction is not a physical entity
    but an epistemic tool. Criticism: boundary is arbitrary; does not apply to
    the Universe as a whole.
  — Many-worlds (Everett 1957): no collapse; the universal wavefunction
    unitarily branches into all outcomes simultaneously; observers become
    entangled with measurement results. Problem: deriving the Born rule from
    the branching structure is contested.
  — Decoherence: environment-induced superselection (einselection) — rapid
    entanglement with the environment damps off-diagonal elements of the
    reduced density matrix ρ_S = Tr_E(|Ψ⟩⟨Ψ|) in the "pointer basis,"
    explaining why macroscopic superpositions are unobservable (decoherence
    time τ_d ~ 10^{−23} s for a dust grain). Decoherence explains the
    appearance of collapse but not why one specific branch is experienced.
"""

[[questions]]
id         = "basic_007"
domain     = "Quantum Field Theory — Renormalisation Group"
difficulty = "hard"
type       = "theory"
question   = """
The coupling constants of the Standard Model run with the energy scale. (a) Explain why renormalisation is necessary in QFT and write the Callan–Symanzik (renormalisation group) equation for a coupling g(μ). (b) Describe qualitatively how the three SM gauge couplings α₁, α₂, α₃ evolve from M_Z to the GUT scale and what "gauge coupling unification" would imply. (c) Explain why unification works significantly better in the Minimal Supersymmetric Standard Model (MSSM) than in the SM, and what this suggests about the scale of supersymmetry breaking.
"""
reference_answer = """
(a) Loop integrals in QFT diverge at high loop momentum (UV divergences).
Renormalisation absorbs these into redefined "bare" parameters: g₀ = μ^ε Z_g g
(in dimensional regularisation, d=4−2ε), so that predictions in terms of the
physical (renormalised) coupling g(μ) and mass m(μ) are finite. Physical
observables cannot depend on the arbitrary scale μ: d/d(lnμ) [Observable] = 0.
This implies the Callan–Symanzik RGE:
  [μ∂/∂μ + β(g)∂/∂g + γ(g)m∂/∂m − nγ_ψ]G^{(n)} = 0
For the running coupling: μ dg/dμ = β(g) = b₁g³ + b₂g⁵ + ...
β < 0 → asymptotic freedom (coupling decreases at high μ): QCD.
β > 0 → infrared freedom / Landau pole: QED, U(1)_Y.

(b) At μ = M_Z: α₁ = 5g'²/(12π) ≈ 1/59, α₂ = g²/(4π) ≈ 1/30, α₃ = αs ≈ 0.118.
(The factor 5/3 normalises U(1)_Y to the GUT embedding.)
Running (one-loop): α_i^{-1}(μ) = α_i^{-1}(M_Z) − (b_i/2π)ln(μ/M_Z)
SM one-loop coefficients: b₁ = +41/10, b₂ = −19/6, b₃ = −7.
α₁ increases, α₂ decreases mildly, α₃ decreases strongly. In the SM the three
couplings nearly but not precisely meet near μ~10¹⁵ GeV — they miss a common
intersection by ~10–15σ when evolved precisely.
Gauge unification would imply a single coupling g_GUT at a Grand Unified Theory
scale M_GUT, embedding SU(3)×SU(2)×U(1) into a simple group (SU(5), SO(10), E₆).

(c) MSSM one-loop coefficients: b₁ = +33/5, b₂ = +1, b₃ = −3.
The additional sparticle loops (squarks, sleptons, gauginos, Higgsinos) modify
the running of all three couplings. In the MSSM with sparticle threshold near
1 TeV, the three α_i^{-1}(μ) lines meet precisely at M_GUT ≈ 2×10¹⁶ GeV — one
of the most striking indirect indications for supersymmetry. This works because
the extra SUSY particles form complete SU(5) multiplets, which shift the beta
functions in a correlated way without spoiling the GUT group structure.
The requirement that sparticles enter at μ ≲ a few TeV (so the unification
remains precise) constrains the SUSY-breaking scale to be accessible at the LHC
— making the null results above ~1 TeV a growing tension for this argument.
"""

[[questions]]
id         = "basic_008"
domain     = "BSM Physics — Hierarchy Problem and SUSY"
difficulty = "hard"
type       = "theory"
question   = """
(a) State the hierarchy problem of the Standard Model: why is it a problem of naturalness rather than logical inconsistency? (b) Show how the Higgs mass-squared receives quadratically UV-divergent radiative corrections from top-quark and scalar loops, and estimate the required fine-tuning if the cutoff is the Planck scale M_Pl. (c) Explain how supersymmetry (SUSY) resolves the hierarchy problem through the cancellation of quadratic divergences between SM particles and their superpartners, and why the LHC non-observation of sparticles above ~1 TeV creates a "little hierarchy problem."
"""
reference_answer = """
(a) The electroweak scale v ≈ 246 GeV and the Planck scale M_Pl ≈ 1.22×10¹⁹ GeV
coexist without logical contradiction — the SM is a perfectly consistent
effective field theory up to some high scale. The problem is naturalness
(Dirac's criterion of no large dimensionless ratios from unrelated physics):
if M_Pl is the fundamental UV cutoff, why is m_h ≈ 125 GeV — a ratio of
m_h/M_Pl ≈ 10^{−17} — maintained without an extraordinary cancellation of
large contributions? There is no symmetry in the SM that forbids large Higgs
mass corrections, unlike fermion masses (protected by chiral symmetry) or
massless gauge bosons (protected by gauge invariance).

(b) Physical Higgs mass: m_h²(phys) = m_h²(bare) + δm_h²
Leading corrections (one-loop, using Pauli-Villars/cutoff Λ_UV):
  Top quark loop (Yukawa y_t ≈ 1):
    δm_h²|_{top} = −(3y_t²/8π²) Λ_UV² + ... [negative, fermion loop]
  Higgs self-energy (quartic λ):
    δm_h²|_{higgs} = +(λ/16π²) Λ_UV² + ...  [positive, boson loop]
  W, Z loops contribute similarly.
Net: δm_h² ~ −(3y_t²/8π²)Λ_UV². For Λ_UV = M_Pl:
  |δm_h²| ~ (3×1)/(8π²) × (10¹⁹)² ≈ 4×10³⁶ GeV²
vs m_h² ≈ (125)² ≈ 1.6×10⁴ GeV². Fine-tuning: 1 part in ~10³² —
an extreme cancellation between m_h²(bare) and δm_h² at every order in
perturbation theory. This is widely considered unacceptable and is the
hierarchy problem.

(c) In SUSY each SM fermion f has a complex scalar superpartner f̃ with
identical gauge quantum numbers and Yukawa coupling. The stop (t̃) contributes:
  δm_h²|_{stop} = +(y_t²/8π²)(m_t̃² − m_t²) ln(Λ/m_t̃) + finite terms
The quadratic Λ² dependence cancels exactly between top and stop loops at all
loop orders — a consequence of the non-renormalisation theorem: SUSY relates
fermion and boson couplings by Ward identities. Residual corrections are
∝ (m_t̃² − m_t²), which is soft (only logarithmically sensitive to Λ). Natural
SUSY requires m_t̃ ≲ few × m_t ~ 500 GeV for tuning ≲ 10%.
LHC constraints: stop masses m_t̃ ≳ 1 TeV in most scenarios, implying
m_t̃² >> m_t² and a residual tuning of ~(m_t̃/m_t)² ~ 10²– the "little
hierarchy problem." Either SUSY is realised in a non-minimal form (compressed
spectra, stealth SUSY, RPV) or alternative solutions (extra dimensions,
compositeness) must be considered.
"""

[[questions]]
id         = "basic_009"
domain     = "BSM Physics — Neutrino Masses"
difficulty = "hard"
type       = "theory"
question   = """
Neutrino oscillations establish that neutrinos have non-zero masses, yet the Standard Model originally predicted m_ν = 0. (a) Derive the two-flavour oscillation probability P(νe→νe; L, E) from first principles, using the relationship between flavour and mass eigenstates. (b) Define the three-generation PMNS mixing matrix, state the three mixing angles and current best-fit values, and explain the significance of the CP-violating phase δ_CP. (c) Describe the Weinberg operator and the type-I seesaw mechanism as the minimal UV completion that generates small Majorana neutrino masses, and estimate the heavy right-handed neutrino mass scale implied by m_ν ~ 0.05 eV and Dirac Yukawa coupling y_ν ~ y_top.
"""
reference_answer = """
(a) Define mixing for two flavours: |νe⟩ = cosθ|ν₁⟩ + sinθ|ν₂⟩,
|νμ⟩ = −sinθ|ν₁⟩ + cosθ|ν₂⟩ (θ: mixing angle).
A νe produced at t=0 evolves as:
|ν(t)⟩ = e^{−iE₁t}cosθ|ν₁⟩ + e^{−iE₂t}sinθ|ν₂⟩
For ultra-relativistic neutrinos (p >> m_i): E_i = √(p²+m_i²) ≈ p + m_i²/2p.
Phase difference: (E₁−E₂)t ≈ Δm²L/(2E), with Δm² = m₂²−m₁², L ≈ t (c=1).
Survival probability:
P(νe→νe) = 1 − sin²(2θ)·sin²(Δm²L/4E)
           = 1 − sin²(2θ)·sin²(1.27 Δm²[eV²] L[km] / E[GeV])
Oscillations require Δm² ≠ 0 (mass splitting) AND θ ≠ 0, π/2 (mixing).

(b) Three-generation PMNS matrix U (Pontecorvo–Maki–Nakagawa–Sakata):
|ν_α⟩ = Σ_i U_{αi}|ν_i⟩, where α=e,μ,τ and i=1,2,3.
Standard parametrisation (ignoring Majorana phases):
U = R₂₃(θ₂₃) · U₁₃(θ₁₃,δ_CP) · R₁₂(θ₁₂)
Current best-fit values (NuFit 2024):
  θ₁₂ ≈ 33.4°  (solar angle, from solar νe and KamLAND)
  θ₂₃ ≈ 49°    (atmospheric, T2K, NOvA; maximal mixing hint)
  θ₁₃ ≈ 8.57°  (reactor, Daya Bay, RENO, Double Chooz)
  δ_CP ≈ −π/2 (−90°, preference for maximal CP violation, ~3σ from T2K/NOvA)
If δ_CP ≠ 0, ν and ν̄ oscillate at different rates — leptonic CP violation.
This may be related to the matter-antimatter asymmetry via leptogenesis
(heavy Majorana neutrino decay in the early Universe → lepton asymmetry →
baryon asymmetry via sphaleron processes).

(c) Lowest-dimension operator extending the SM that gives neutrino masses is
the Weinberg operator (dimension-5): (1/Λ)(L̄Φ̃)(Φ̃^T L^c) + h.c.
After EWSB: m_ν = v²/Λ. For m_ν ~ 0.1 eV → Λ ~ v²/m_ν ~ (246)²/10^{−10} GeV
~ 6×10¹⁴ GeV.
Type-I seesaw UV completion: add n_R right-handed (sterile) neutrinos N_R with
gauge-singlet Majorana mass M_R and Yukawa L_Y = y_ν L̄Φ̃N_R + ½M_R N_R^c N_R.
After EWSB (m_D = y_ν v), the 2n×2n mass matrix in the (ν_L, N_R) basis has
eigenvalues (for M_R >> m_D):
  Light:  m_ν ≈ −m_D M_R^{−1} m_D^T  (seesaw formula)
  Heavy:  M_N ≈ M_R
For y_ν ~ y_top ≈ 1 → m_D ~ v ≈ 246 GeV, m_ν ~ 0.05 eV:
  M_R ~ m_D²/m_ν ~ (246 GeV)²/(0.05×10^{−9} GeV) ~ 1.2×10¹⁵ GeV
This is close to the GUT scale M_GUT ~ 2×10¹⁶ GeV, suggesting deep connections
between neutrino masses, baryon asymmetry, and grand unification.
"""

[[questions]]
id         = "basic_010"
domain     = "Quantum Gravity — Black Holes and Information"
difficulty = "hard"
type       = "theory"
question   = """
Black holes sit at the intersection of general relativity and quantum mechanics. (a) Derive the Hawking temperature T_H of a Schwarzschild black hole of mass M from dimensional analysis and a physical argument about virtual pair creation near the horizon. (b) Describe the black hole information paradox: why does Hawking radiation naively imply that quantum information is destroyed, and why this violates the unitarity of quantum mechanics. (c) Briefly describe three proposed resolutions — black-hole complementarity, firewalls (AMPS), and the ER=EPR conjecture — and the key insight or trade-off each makes.
"""
reference_answer = """
(a) Dimensional analysis: the only combination of G, ħ, c, k_B, M giving a
temperature is T_H = α ħc³/(G M k_B). Hawking derived α = 1/(8π):
  T_H = ħc³/(8πGMk_B) ≈ 6.17×10^{−8} K × (M_☉/M)
Physical argument: near the horizon (proper acceleration a = c²/r_s for a
static observer at r_s = 2GM/c²), the Unruh effect gives a thermal bath at
T_Unruh = ħa/(2πck_B). Hawking showed that a distant static observer sees
the same temperature T_H = T_Unruh/(1+z) after gravitational redshift
(1+z = (1−r_s/r)^{−1/2} → ∞ at r=r_s; a proper accounting gives the
Hawking result). Alternatively: Bogoliubov transformation between the inertial
infalling vacuum and the static Schwarzschild vacuum mixes positive/negative
frequency modes, giving a thermal spectrum for the static observer.
As the BH radiates, M decreases, T_H increases → runaway evaporation.

(b) Information paradox: a black hole formed from a pure quantum state (e.g.
a specific matter configuration |Ψ_in⟩) radiates thermally — Hawking's
calculation shows the radiation state is exactly a mixed (thermal) density
matrix ρ_rad, independent of |Ψ_in⟩. If the BH evaporates completely, we have:
  pure state → mixed state
This violates unitarity — the cornerstone of quantum mechanics. It also
violates the CPT theorem, since the reverse process (mixed state → pure state)
would be needed for time-reversal invariance. The information seemingly carried
into the singularity is irretrievably lost, an unacceptable conclusion from the
perspective of quantum mechanics.

(c) Three proposed resolutions:
  — Black-hole complementarity (Susskind, Thorlacius, Uglum, 1993): information
    is NOT lost; it is encoded in subtle quantum correlations of the Hawking
    radiation — in principle recoverable by a superobserver with exponential
    computational resources. The key postulate is that no single observer can
    simultaneously verify both that information escapes and that it falls into
    the singularity (complementarity, analogous to wave-particle duality).
    Trade-off: requires information to be present in two places at once,
    violating no-cloning only because the two copies are causally disconnected.
  — Firewalls (Almheiri, Marolf, Polchinski, Sully, 2012): demanding that
    Hawking radiation be in a pure state (unitarity) AND that early and late
    Hawking quanta are entangled (monogamy of entanglement) implies that the
    infalling partner quanta cannot also be entangled with the interior —
    breaking the smooth horizon. An infalling observer hits a "firewall" of
    high-energy quanta at r_s, violating the equivalence principle. Trade-off:
    preserves unitarity but sacrifices the equivalence principle.
  — ER = EPR (Maldacena, Susskind, 2013): the entanglement (EPR) between
