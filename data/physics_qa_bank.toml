[[questions]]
id         = "ml_001"
domain     = "Machine Learning / Fast Simulation"
difficulty = "hard"
type       = "technological"
question   = """
Full GEANT4-based calorimeter simulation is a major computational
bottleneck in LHC data production.  The MBI ML group develops deep
generative models as fast surrogates.

(a) Explain why calorimeter shower simulation is computationally
    expensive in GEANT4, and describe how a deep generative model
    replaces the simulation step.  What speedup factors are achievable
    and why?

(b) Compare two generative architectures used for this task —
    Generative Adversarial Networks (GANs) and normalizing flows —
    discussing their training objectives, mode-coverage behaviour, and
    suitability for reproducing tail distributions critical in physics
    analyses.
"""
reference_answer = """
(a) GEANT4 cost and generative surrogate:
GEANT4 tracks every secondary particle (electrons, photons, hadrons)
produced in electromagnetic and hadronic showers step-by-step through
a detailed material description of the calorimeter.  A single shower
in an ECAL crystal array can produce O(10⁴–10⁵) steps; at LHC
collision rates (40 MHz bunch crossing, ~1 kHz event storage rate),
simulation consumes ~60–80% of the total WLCG computing budget.

A deep generative model learns the conditional distribution
p(deposited energies in all calorimeter cells | incident particle
type, energy, angle) from a library of pre-run GEANT4 showers.  At
inference time it samples a full shower in a single forward pass,
generating all cell energies in parallel rather than tracing each
secondary.  This removes the O(N_step) sequential cost, yielding
speedups of 10³–10⁴× over GEANT4 (confirmed in CaloGAN, CaloFlow,
CaloDiffusion, and related works).  Quality is validated by comparing
1-D and 2-D projections of cell-energy distributions, shower shape
observables (longitudinal and lateral profiles, total energy, sparsity)
between generated and GEANT4 showers.

(b) GANs vs. normalizing flows:

GANs (e.g. CaloGAN, AtlFast3-GAN):
Training objective: minimax game between generator G (maps noise z to
shower) and discriminator D (distinguishes real from generated).
Loss: min_G max_D E[log D(x)] + E[log(1−D(G(z)))].
Strengths: fast sampling, high visual fidelity in dense regions.
Weaknesses: mode collapse — G may ignore low-probability but
physically important regions (high-energy tails, rare shower
topologies); training instability; no exact likelihood.

Normalizing flows (e.g. CaloFlow, INNs):
A sequence of invertible transformations maps a simple base
distribution (Gaussian) to the target shower distribution.
Exact log-likelihood is tractable: log p(x) = log p_z(f⁻¹(x)) +
log|det J_{f⁻¹}|.  Training by maximum likelihood.
Strengths: exact density evaluation (useful for reweighting),
full mode coverage (no mode collapse), principled uncertainty
quantification, better tail fidelity — essential for triggering on
rare high-energy deposits or measuring tails of shower-shape
distributions used in signal/background discrimination.
Weaknesses: constrained architecture (bijective layers), slower
training than GANs for high-dimensional data.

For physics use cases requiring accurate rare-event modelling,
normalizing flows and score-based diffusion models (CaloDiffusion)
generally outperform GANs on tail observables at the cost of higher
per-sample generation time.
"""

[[questions]]
id         = "ml_002"
domain     = "Machine Learning / Monte Carlo Enhancement"
difficulty = "hard"
type       = "phenomenological"
question   = """
The MBI ML group applies normalizing flows to accelerate importance
sampling in Monte Carlo event generators such as Sherpa and MadGraph.

(a) Define importance sampling in the context of multi-dimensional
    phase-space integration for cross-section calculations.  Why is
    naive Monte Carlo inefficient for high-multiplicity final states?

(b) Explain how a trained normalizing flow can serve as an adaptive
    importance sampling proposal distribution, and what figure of
    merit (variance or effective sample size) is optimised during
    flow training in this application.
"""
reference_answer = """
(a) Importance sampling and multi-dimensional integration:
The cross-section is σ = ∫ |M|²(Φ) dΦ where Φ is the n-body
phase space.  For a 2 → n process with n ≥ 4, Φ has dimension
3n − 4 ≥ 8.  Naive Monte Carlo estimates σ ≈ V ⟨|M|²⟩ by drawing
points uniformly from the phase-space volume V.  The variance of
the estimator scales as Var ∝ ⟨|M|⁴⟩ − ⟨|M|²⟩²; because |M|² is
highly peaked near resonances (Breit-Wigner denominators), collinear
and soft divergences (1/p_T², 1/s_ij), and threshold enhancements,
the ratio Var/⟨|M|²⟩² (coefficient of variation squared) is enormous
— requiring O(10⁶–10⁸) points for 1% accuracy at high multiplicity
with uniform sampling.

Importance sampling replaces uniform sampling with a proposal q(Φ)
chosen to mimic |M|²:
  σ ≈ (1/N) Σ_i |M|²(Φ_i) / q(Φ_i),   Φ_i ~ q.
Optimal choice q*(Φ) ∝ |M|²(Φ) gives zero variance.  Traditional
generators (VEGAS, multi-channel) build q from factorised products of
1-D mappings aligned to known peaks; constructing these mappings by
hand for high-multiplicity processes is labour-intensive and
sub-optimal.

(b) Normalizing flow as adaptive proposal:
A normalizing flow f_θ: z → Φ with base z ~ N(0,I) defines
q_θ(Φ) = p_z(f_θ⁻¹(Φ)) |det J_{f_θ⁻¹}|.
This is an expressive, flexible density that can learn arbitrary
peaked structures in phase space.

Training objective — minimise the variance of the importance weight
w(Φ) = |M|²(Φ)/q_θ(Φ):
  L(θ) = Var_q[w] = E_q[w²] − (E_q[w])² .
Equivalently, this is equivalent to minimising the χ² divergence
D_χ²(p* || q_θ) where p* ∝ |M|².
An alternative (used in some implementations) is forward KL
divergence: L = −E_{p*}[log q_θ(Φ)] = H(p*, q_θ), minimised by
sampling from |M|² using GEANT4/existing generator and fitting q_θ
by maximum likelihood.

Figure of merit: effective sample size ESS = (Σ w_i)² / Σ w_i²,
maximised when all weights are equal (perfect proposal).
ESS/N → 1 means the flow perfectly reproduces |M|²; ESS/N ≪ 1
signals residual mismatch.  In practice flows trained on
4–6-particle final states reach ESS/N > 0.9, reducing the required
MC sample by O(10–100×) for fixed statistical uncertainty.
"""

[[questions]]
id         = "ml_003"
domain     = "Machine Learning / CaloChallenge"
difficulty = "medium"
type       = "technological"
question   = """
The MBI ML group coordinates the Fast Calorimeter Simulation Challenge
(CaloChallenge), a community benchmark for generative calorimeter
simulation.

(a) Describe the benchmark datasets used in the CaloChallenge and why
    they are organised by increasing dimensionality.  What physics
    detector geometry do they represent?

(b) List four evaluation metrics used to compare generative models
    in the challenge and explain what each captures about simulation
    fidelity.
"""
reference_answer = """
(a) CaloChallenge datasets:
The CaloChallenge provides three progressively complex datasets,
each consisting of GEANT4-simulated calorimeter showers conditioned
on incident particle energy:

• Dataset 1 (low-dim): photon and pion showers in a simplified
  cylindrical calorimeter with 368 cells (3 radial × ~45 angular
  bins × layers) — tractable for any architecture, used to validate
  correctness.
• Dataset 2 (medium-dim): electrons in an ATLAS-like sampling
  calorimeter with ~6 000 cells across radial, angular, and
  longitudinal layers — requires capturing correlations across
  detector layers and radial shower profiles.
• Dataset 3 (high-dim): pions in a full CMS-like sampling calorimeter
  with ~40 000 cells — pushes generative models to high-dimensional
  sparse distributions with hadronic sub-structure.

The layered structure represents electromagnetic and hadronic sampling
calorimeters where alternating absorber (Pb, Fe) and active (liquid
Ar, scintillator) material creates a discrete longitudinal profile.
Dimensionality escalates so that models successful on Dataset 1 are
not guaranteed to scale to Dataset 3 — the challenge exposes
architectural limitations.

(b) Four evaluation metrics:

1. Shower shape histograms (1-D marginals):
   Distributions of physics observables — total deposited energy
   E_dep, longitudinal centre-of-gravity ⟨λ⟩, radial width σ_R,
   layer-by-layer energy fractions — compared between GEANT4 and
   generated samples using histogram χ² or separation power
   (1 − AUC of a classifier trained to distinguish the two).
   Captures per-observable fidelity but not correlations.

2. Classifier / discriminator AUC:
   A neural classifier is trained to distinguish GEANT4 from
   generated showers using the full cell-energy vector as input.
   AUC = 0.5 indicates indistinguishable distributions (ideal);
   AUC → 1 indicates detectable differences.  This is the most
   sensitive metric for multi-dimensional discrepancies.

3. Fréchet Calorimeter Distance (FCD) / Maximum Mean Discrepancy (MMD):
   FCD: Fréchet distance between feature-layer activations of a
   physics-aware network (analogous to FID in image generation),
   measuring distributional similarity in a learned latent space.
   MMD: kernel-based two-sample test statistic.  Both detect
   multi-dimensional distribution mismatches without assuming a
   parametric form.

4. Generation speed (samples / second):
   Wall-clock time per shower on standard hardware (GPU), including
   sampling and any post-processing.  Critical figure of merit: the
   goal is to replace GEANT4 (O(1–10) min/shower on CPU) with
   sub-millisecond generation on GPU.  A model with excellent fidelity
   but only 10× speedup may not be practically useful.
"""

[[questions]]
id         = "ml_004"
domain     = "Machine Learning / Anomaly Detection"
difficulty = "hard"
type       = "phenomenological"
question   = """
The MBI ML group developed CATHODE (Classifying Anomalies Through
Outer Density Estimation) for model-independent searches for physics
beyond the Standard Model at the LHC.

(a) Explain the CATHODE method step by step: how it uses a
    conditional generative model to construct a signal-depleted
    background reference dataset, and how the anomaly score is
    subsequently computed.

(b) Compare CATHODE to the classic cut-and-count bump hunt in an
    invariant mass spectrum: what are the advantages of CATHODE, and
    what assumptions does it rely on that could introduce systematic
    bias?
"""
reference_answer = """
(a) CATHODE method:
CATHODE operates in a two-feature space: a resonant feature m
(e.g. dijet invariant mass) and a set of high-level or low-level
event features x (jet substructure variables, particle-flow objects).

Step 1 — Signal region definition:
A signal region (SR) is defined as a window in m around a candidate
mass m_0 (e.g. m_0 ± 100 GeV).  Sideband regions (SB) on either
side are signal-depleted by assumption (no localised new physics).

Step 2 — Conditional generative model trained on sidebands:
A normalizing flow or similar deep generative model is trained on SB
data to learn p_SB(x | m).  This model learns how the multivariate
feature distribution x depends smoothly on m — capturing the
background morphology.

Step 3 — Background template generation in SR:
The trained model is evaluated at m values inside the SR (or at m_0)
to generate synthetic background events x̃ ~ p_SB(x | m ∈ SR).
These synthetic events approximate the background distribution in the
SR under the assumption that background varies smoothly with m and
that the SB model extrapolates validly.

Step 4 — Anomaly classifier:
A binary classifier (e.g. BDT or neural network) is trained to
distinguish real SR data (which may contain signal) from the
generated background template x̃.  The classifier output D(x)
serves as an anomaly score; events with high D(x) are flagged as
anomalous.

Step 5 — Statistical test:
The distribution of the anomaly score is examined; a model-agnostic
excess over background (estimated from the classifier score
distribution in SR vs. generated events) is tested for significance.
CMS applied this approach in a published dijet search (CMS-EXO-22-026).

(b) CATHODE vs. classic bump hunt:

Classic bump hunt:
Fits a smooth parametric function (polynomial, power law) to the
m spectrum and looks for a localised excess in a single 1-D
distribution.  Sensitive only to rate excesses; insensitive to
changes in event topology (shape of x).

CATHODE advantages:
• Multi-dimensional sensitivity: exploits all event features x,
  not just the rate in m — new physics with distinct kinematics
  but small rate excess becomes detectable.
• Model-independent: no assumed signal topology; works for any
  localised resonance that differs in x from background.
• Potential for O(10×) improved sensitivity over bump hunt for
  signals with distinctive substructure.

Assumptions and potential biases:
• Smooth background in m: p_BG(x | m) must vary smoothly so the
  SB model extrapolates correctly into the SR — violated if a
  detector threshold or kinematic edge coincides with the SR.
• Signal contamination in SB: if the signal is broad in m and
  leaks into SB, the generative model learns signal-contaminated
  background, inflating the classifier background template and
  reducing sensitivity (signal "self-sculpting").
• Generative model mismodelling: errors in p_SB(x | m)
  propagate as fake anomalies or missed signals; calibration in
  signal-free control regions is essential.
"""

[[questions]]
id         = "ml_005"
domain     = "Machine Learning / BSM Searches"
difficulty = "medium"
type       = "phenomenological"
question   = """
Model-independent searches for physics beyond the Standard Model
(BSM) at the LHC increasingly rely on machine learning anomaly
detection methods.

(a) Contrast three paradigms for ML-based BSM searches — fully
    supervised, weakly supervised, and fully unsupervised — explaining
    the signal assumptions each requires and their respective
    sensitivity trade-offs.

(b) Explain the concept of a "likelihood ratio" anomaly score and
    why it is theoretically optimal for detecting any deviation from
    the Standard Model background hypothesis, connecting this to the
    Neyman-Pearson lemma.
"""
reference_answer = """
(a) Three paradigms for ML-based BSM searches:

1. Fully supervised:
A classifier is trained on labelled SM background Monte Carlo vs.
a specific BSM signal simulation.  Achieves the highest sensitivity
for the targeted signal (approaches the Neyman-Pearson optimal test
statistic for that hypothesis), but is blind to signals not in the
training set — if the true new physics differs from the simulated
model (wrong mediator, different decay mode), sensitivity collapses.
Example: boosted H→bb̄ tagger trained on QCD vs. ggH signal.

2. Weakly supervised (e.g. CWoLa, CATHODE):
Uses data-driven methods that exploit the mixture of signal + background
in the signal region vs. a background-only control region.
Classification Without Labels (CWoLa): trains a classifier to
distinguish SR from SB data; if signal is present in SR, the
classifier learns signal-vs-background implicitly.
Requires only that the SR is enriched in signal relative to SB —
no signal simulation needed.  Sensitivity is intermediate: better
than a cut-and-count bump hunt, lower than fully supervised for the
true signal.  Model-dependence enters only through the feature
choice and the CR/SR definition.

3. Fully unsupervised (e.g. autoencoders, density estimation):
No labels, no signal/background regions — looks for regions of
low density or high reconstruction error in the full feature space.
Examples: autoencoder reconstruction loss, isolation forest,
normalizing flow log-likelihood anomaly score.
Requires no prior knowledge of signal topology or resonant feature.
Risk: sensitive to poorly modelled SM tails and detector artefacts
rather than genuine new physics; choice of architecture imposes
implicit inductive biases about what counts as "anomalous".

Sensitivity hierarchy (for a specific signal):
fully supervised >> weakly supervised > fully unsupervised,
but model-independence hierarchy is reversed.

(b) Likelihood ratio anomaly score and Neyman-Pearson optimality:
The Neyman-Pearson lemma states that the most powerful test of a
simple null hypothesis H₀ (SM background) against a simple
alternative H₁ (specific signal) at fixed significance level α is
the likelihood ratio test:
  T(x) = p(x | H₁) / p(x | H₀) ≥ η_α.

For model-independent BSM searches, the "ideal" anomaly score is
  A(x) = p_SM(x) / p_data(x)   or equivalently   p_data(x) / p_SM(x),
where p_SM is the SM background density and p_data is the true
(unknown) data density.  Events where A(x) ≫ 1 are improbable under
SM and likely signal.

This is optimal in the sense that no other test statistic contains
more information about whether x is anomalous relative to SM
(Neyman-Pearson ensures no test has simultaneously higher power at
fixed false-positive rate).

In practice p_data is unknown; it is estimated by:
• Training a discriminator between data and a SM simulation
  reference: by the likelihood-ratio trick, the classifier output
  f*(x) ≈ p_data/(p_data + p_SM), so the LR is recovered as
  f*/(1−f*) — the ANODE method.
• Using normalizing flows to model both p_SM and p_data directly.
The quality of the LR estimator determines how close to optimal the
search is; mis-modelling of p_SM is the dominant systematic.
"""

