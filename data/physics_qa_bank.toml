[[questions]]
id         = "hist_006"
domain     = "UA1 / SppS — W Boson Discovery"
difficulty = "hard"
type       = "experimental"
question   = """
The UA1 experiment at the CERN SppS proton–antiproton collider announced the discovery of the W± boson in January 1983. Describe (a) how W⁺→e⁺νe and W⁻→e⁻ν̄e candidates were identified using the central drift chamber and the gondola electromagnetic calorimeter (including HEPHY Vienna's role in calibrating the gondola photomultiplier readout), (b) how missing transverse energy E_T^miss was computed and used to infer the undetected neutrino, (c) how QCD multi-jet backgrounds were suppressed through isolation and hadronic-fraction cuts, and (d) how the transverse mass M_T and its Jacobian edge provided the W mass estimate.
"""
reference_answer = """
(a) W→eν signature: a high-pT isolated electron/positron (E_T > 25 GeV) in the
gondola ECAL — 48 lead-scintillator barrel sectors shaped like boats ("gondolas"),
each read out by photomultiplier tubes. HEPHY Vienna contributed the calibration
of the PM readout of the gondola ECAL, ensuring a uniform electromagnetic energy
scale. The electron was matched to a charged track in the large cylindrical central
detector (CD; 170,000 sense wires in argon-ethane, 0.7 T magnetic field, 6 m length,
2.3 m diameter).

(b) By momentum conservation in the transverse plane, Σ p_T of all detected
particles sums to zero in a symmetric collider; the vector sum −Σ E_Ti n̂_i
(summed over all calorimeter cells) gives the transverse momentum of the neutrino.
Events with E_T^miss > ~15–25 GeV and a high-pT electron candidate selected
W→eν. The neutrino direction was collinear with E_T^miss.

(c) QCD jets mimic electrons via π⁰→γγ or early showering pions. Suppression
applied: (i) isolation — total hadronic E_T in a cone ΔR < 0.4 around the
electron candidate < 5 GeV; (ii) E_had/E_em < 0.15 in the electron cluster;
(iii) a track from the CD pointing to the ECAL cluster. In genuine W events,
E_T^miss is large and back-to-back with the electron in the transverse plane;
in jet fakes, E_T^miss is small or multi-directional.

(d) Transverse mass M_T = √(2 p_T^e p_T^ν (1 − cosΔφ_{eν})) is invariant
under longitudinal boosts and is bounded above by M_W, producing a sharp
Jacobian peak (rising edge) just below M_W from which the mass is extracted.
The original discovery used 6 W→eν candidates; subsequent UA1 datasets yielded
M_W = 80.9 ± 1.5 GeV, in excellent agreement with the electroweak prediction
M_W = M_Z cos θ_W ≈ 78–82 GeV.
"""

[[questions]]
id         = "hist_007"
domain     = "UA1 / SppS — Z Boson and Electroweak Constraints"
difficulty = "hard"
type       = "experimental"
question   = """
Following the W discovery, UA1 observed the Z⁰ boson in May 1983 through the Z⁰→e⁺e⁻ and Z⁰→μ⁺μ⁻ channels. Explain (a) how the Z candidates were reconstructed and what invariant mass was measured, (b) how the ratio R = [σ(pp̄→W)·B(W→eν)] / [σ(pp̄→Z)·B(Z→ee)] provided a luminosity-independent test of the Standard Model and constrained sin²θ_W, and (c) the role of stochastic cooling in the Antiproton Accumulator (AA) that made the SppS luminosity sufficient for these discoveries.
"""
reference_answer = """
(a) Z→ee: two isolated high-pT electrons (E_T > 25 GeV each) in the gondola ECAL
with invariant mass M_ee = √(2 E₁E₂(1−cosα)) ≈ M_Z ≈ 91 GeV, where α is the
opening angle measured from CD tracks. Z→μμ: two penetrating muon tracks in the
UA1 muon chambers (outside the 80 cm iron hadron absorber), with their momenta
measured from the curvature of CD tracks; M_μμ reconstructed to within the
CD momentum resolution. UA1's initial Z signal comprised ~8 candidates near
M ≈ 95 GeV (later refined to 91.2 GeV).

(b) Many systematic uncertainties (parton luminosity, acceptance corrections)
cancel in the ratio R. In the SM, R can be computed from parton distributions
and the electroweak partial widths B(W→eν) = Γ(W→eν)/Γ_W ∝ 1/(1 + ...) and
B(Z→ee) = Γ(Z→ee)/Γ_Z. Measuring R experimentally and comparing to the SM
prediction (which depends on sin²θ_W through the branching ratios and the ratio
of W and Z production cross sections via the Drell-Yan mechanism) provided a
cross-check of electroweak unification. UA1's measurement of R was consistent
with sin²θ_W ≈ 0.22, in agreement with neutral-current scattering determinations.

(c) The SppS required antiprotons at densities impossible to produce directly.
Stochastic cooling (invented by Simon van der Meer): a "pick-up" detector senses
the centroid displacement and momentum spread of the antiproton beam; an
electronic signal corrects a downstream "kicker" magnet on a timescale shorter
than the revolution period, cooling the beam phase space. The AA accumulated
~10¹¹ p̄ per SPS fill over ~24 hours. Van der Meer also devised the van der Meer
scan to measure the luminosity of colliding beams. The Nobel Prize in Physics 1984
was awarded to Carlo Rubbia (UA1 spokesperson) and Simon van der Meer (stochastic
cooling and AA design).
"""

[[questions]]
id         = "hist_008"
domain     = "UA1 / SppS — Jets, Missing Energy, and SUSY Search"
difficulty = "hard"
type       = "phenomenological"
question   = """
Beyond the W and Z discoveries, UA1 explored QCD jet physics and searched for new phenomena. Describe (a) how dijet events at the SppS demonstrated hard parton–parton scattering and what the jet transverse-energy spectrum revealed about parton distribution functions, (b) the observation of anomalous monojet events (single jet + large E_T^miss) in the 1983–84 run and the competing interpretations as W→τν vs SUSY squark/gluino production, and (c) how subsequent analysis resolved the monojet puzzle in favour of the Standard Model explanation.
"""
reference_answer = """
(a) In pp̄ → 2 jets + X, two back-to-back jets arise from QCD 2→2 parton
scattering (qq̄→qq̄, qg→qg, gg→gg). The jet E_T spectrum falls steeply as
dσ/dE_T ∝ E_T^{-4 to -5}, reflecting the falling parton distribution functions
(PDFs) and the 1/ŝ² dependence of the hard-scattering matrix elements. UA1
measured dijets up to E_T ~ 150 GeV, confirming QCD at short distances and
providing early constraints on the gluon PDF at large x. Event shapes (azimuthal
decorrelation, jet broadening) were consistent with O(αs²) predictions.

(b) UA1 reported ~6 "monojet" events with E_T^jet > 40 GeV and E_T^miss > 40 GeV
and no balancing second jet, a rate far above expectations from instrumental
effects. Two interpretations:
  — SM: W⁻→τ⁻ν̄τ where τ→hadrons+ντ produces a narrow hadronic cluster
    (appearing as a single jet) plus multi-neutrino missing energy; similarly
    Z→ν̄ν + initial-state radiation jet (Z+jet) contributes.
  — SUSY: pp̄ → q̃q̃* or g̃g̃ production, with q̃→q+χ̃⁰ or g̃→g+χ̃⁰ giving
    hard jets and invisible neutralinos, consistent with light sparticle masses
    m ~ 20–40 GeV. Some UA1 members (notably Rubbia) favoured this interpretation.

(c) With the 1984–85 SppS run at √s = 630 GeV, the monojet cross section scaled
precisely with the W production cross section as expected from W→τν, and the
event properties (narrow τ-like jet, cluster mass consistent with one-prong or
three-prong τ decay, E_T^miss direction consistent with single-neutrino
kinematics) matched W→τν Monte Carlo. Light gluinos were subsequently excluded
by LEP searches (e⁺e⁻→g̃g̃ below M_Z/2) and by detailed kinematics (SUSY
predicts softer jets than observed). The monojet events are now understood as the
first observation of W→τν at a hadron collider.
"""

[[questions]]
id         = "hist_009"
domain     = "NA36 / SPS — Strangeness Enhancement and QGP"
difficulty = "hard"
type       = "experimental"
question   = """
The NA36 experiment at the CERN SPS studied strange particle production in sulphur-induced nuclear collisions at 200 GeV/c per nucleon using a large time projection chamber (TPC). Describe (a) the Rafelski–Müller (1982) prediction that quark-gluon plasma formation enhances strangeness production relative to hadronic interactions, (b) the NA36 TPC design and how it reconstructed V⁰ (K⁰_S, Λ, Λ̄) and cascade (Ξ⁻, Ξ̄⁺) decay vertices in the forward rapidity region, and (c) the strangeness-enhancement observations in S+S and S+Pb collisions compared to p+S reference data.
"""
reference_answer = """
(a) In hadronic matter, ss̄ pair production requires at least two separate
scatterings (e.g. π+N → K+Y) and is suppressed by the strange-quark mass
threshold (m_s ~ 150 MeV ≳ T_had ~ 160 MeV). In a QGP, gluon fusion gg → ss̄
is copious because all partons are thermalized and the effective ss̄ threshold
is just 2m_s, not the hadronic excitation energy. Strangeness reaches chemical
equilibrium on a timescale τ_eq ~ 2–3 fm/c < τ_fireball. Rafelski and Müller
(PLB 101, 111, 1982) predicted enhanced K, Λ, Ξ, Ω yields per participating
nucleon, with the enhancement increasing with strangeness content:
K < Λ < Ξ < Ω.

(b) The NA36 TPC (1800 readout channels; rapidity coverage 1 < y < 4 in the
lab frame; magnetic field aligned with the beam axis) recorded tracks of charged
secondary particles. The primary beam avoided the TPC fiducial volume; a dipole
magnet swept low-momentum primary pions away. V⁰ vertices (K⁰_S→π⁺π⁻,
Λ→pπ⁻, Λ̄→p̄π⁺) were found by pairing oppositely charged tracks with a
displaced vertex (V-shape), applying invariant-mass and flight-length cuts.
Cascade Ξ⁻→Λπ⁻ decays were identified as a Λ-V⁰ vertex with an additional
track forming a secondary V. Reconstruction efficiencies were determined from
GEANT simulations of the TPC response.

(c) NA36 measured Λ and K⁰_S production in S+S and S+Pb collisions at
200 GeV/c per nucleon. Yields normalised per participant nucleon N_part
(estimated from TPC charged-track multiplicity via the Glauber model) showed
enhanced Λ/π and K/π ratios in central S+S and S+Pb compared to p+Pb reference
data recorded in the same run. The Λ̄/Λ anti-baryon ratio also increased with
centrality, indicating partial restoration of baryon-number transparency and
strangeness equilibration. These results were consistent with contemporaneous
NA35 (streamer chamber) and WA85 (Ω spectrometer) results, collectively
forming part of the evidence base cited in the CERN February 2000 announcement
of "a new state of matter" at the SPS.
"""

[[questions]]
id         = "hist_010"
domain     = "NA36 / SPS — Energy Density and Thermal Model"
difficulty = "medium"
type       = "phenomenological"
question   = """
Interpret the NA36 measurements of charged-particle rapidity distributions in S+S collisions at 200 GeV/c per nucleon within the frameworks used to characterise the hot dense matter created. Explain (a) how Bjorken's formula relates the midrapidity transverse-energy density dE_T/dy to the initial energy density ε_Bj, and whether the NA36 conditions exceeded the lattice QCD deconfinement threshold, (b) how the Glauber model was used to characterise the collision geometry and define centrality in terms of participants N_part and binary collisions N_coll, and (c) how fitting the strange-particle yield ratios (Λ, Λ̄, K⁰_S, Ξ) with a statistical thermal model constrained the fireball temperature T and the strangeness saturation factor γ_s.
"""
reference_answer = """
(a) Bjorken (1983): in a boost-invariant longitudinal expansion the energy
density at proper time τ₀ is
  ε_Bj = (1 / (π R_A² τ₀)) · dE_T/dy|_{y=0},
where R_A = 1.2 A^{1/3} fm is the nuclear radius and τ₀ ~ 1 fm/c is the
thermalisation time. For central S+S (A = 32), dE_T/dy ~ 40–60 GeV gives
ε_Bj ~ 1.5–3 GeV/fm³, comfortably above the lattice QCD critical energy density
ε_c ~ 0.5–1 GeV/fm³ (T_c ~ 155–165 MeV) at the time of the SPS programme,
suggesting that deconfinement conditions were transiently reached.

(b) The Glauber model treats each nucleon-nucleon collision independently with
total cross section σ_NN ~ 32 mb (at 200 GeV). For a head-on S+S collision at
impact parameter b = 0, all 32+32 nucleons participate (N_part ~ 64), and the
number of binary collisions N_coll ~ A^{4/3}/2 ~ 70. In practice, NA36 used the
measured TPC charged-track multiplicity distribution: the top 5–10% of events
(highest multiplicity) corresponds to the most central collisions. Yields scaled
by N_part remove trivial superposition effects and reveal genuine nuclear-medium
enhancements.

(c) The statistical thermal model (Braun-Munzinger, Koch, Rafelski) describes
particle yields in a chemically frozen fireball by grand-canonical partition
functions at temperature T_ch (chemical freeze-out temperature) and baryochemical
potential μ_B. An extra factor γ_s^{|S|} (strangeness saturation) accounts for
incomplete equilibration, where γ_s = 1 means full chemical equilibrium and
γ_s < 1 partial. Fitting NA36 Λ, Λ̄, K⁰_S (and combined with WA85 Ξ) yields
T_ch ≈ 160–180 MeV (consistent with the hadronisation temperature) and
γ_s ≈ 0.5–0.8 for central S+S — significantly above γ_s ~ 0.1–0.2 in pp
collisions and rising toward unity in Pb+Pb at the SPS, indicating progressive
strangeness equilibration with system size as expected for a QGP source.
"""

