# Gravitational Waves  (5 questions)
# Source: https://www.oeaw.ac.at/en/mbi/research/gravitational-waves
# MBI focus: IMBHs, LVK detector network, Einstein Telescope,
#            dark matter effects on waveforms, ML/FPGA analysis methods
# 3 phenomenological  |  2 experimental / technological
# ─────────────────────────────────────────────────────────────────────────────

[[questions]]
id         = "gw_001"
domain     = "Gravitational Waves / Detector Technology"
difficulty = "hard"
type       = "technological"
question   = """
Advanced LIGO is the world's most sensitive gravitational-wave
interferometer.

(a) Describe the operating principle of Advanced LIGO: how does a
    Michelson interferometer detect a gravitational wave, and what
    roles do Fabry-Perot arm cavities, power recycling, and signal
    recycling play?

(b) Identify the two dominant noise sources that limit sensitivity in
    different frequency bands and explain how they scale with laser
    power.
"""
reference_answer = """
(a) Operating principle:
A gravitational wave (GW) stretches space along one arm while
compressing the other, modulating the differential arm length by
δL = h L / 2, where h is the strain amplitude and L = 4 km the arm
length.  For a typical GW event (h ~ 10⁻²¹) this corresponds to
δL ~ 2×10⁻¹⁸ m — 1/1000 the diameter of a proton.

Key optical enhancements in Advanced LIGO:
• Fabry-Perot arm cavities: mirrors at each arm end make light
  resonate, increasing the effective storage time (finesse F ≈ 450,
  effective length ~1800 km) and thus the phase shift accumulated per
  photon.
• Power recycling mirror (PRM): placed between the laser and the
  beamsplitter, it resonantly enhances the circulating power from
  ~125 W input to ~750 kW in the arms, boosting the photon statistics
  and reducing shot noise.
• Signal recycling mirror (SRM): placed at the output (dark) port,
  it reshapes the frequency-dependent response ("detuning") of the
  instrument, allowing the bandwidth to be tuned to match the expected
  GW signal band.

(b) Dominant noise sources and power scaling:

1. Shot noise (quantum measurement noise): photon counting statistics
   produce a phase uncertainty δφ ∝ 1/√N_photons ∝ 1/√P.
   Shot noise-limited strain sensitivity:
     h_shot ~ (1/L) √(ℏω / (2η P))
   where η is the photodetector efficiency.  It dominates above
   ~100 Hz and improves as P increases.

2. Radiation-pressure noise (quantum back-action): each photon carries
   momentum ℏω/c; random fluctuations in radiation pressure on the
   mirror produce position noise δx ∝ √P / (m Ω²).
     h_RP ∝ √P / (m Ω²)
   This dominates below ~50 Hz and worsens with higher power.

The product h_shot × h_RP = ℏ/(mL²Ω²) defines the Standard Quantum
Limit (SQL) — a fundamental bound for a free-mass interferometer at
a given frequency.  Advanced LIGO uses frequency-dependent squeezing
(injected squeezed vacuum at the output port, rotated via filter
cavities) to surpass the SQL and reduce both noise sources
simultaneously.
"""

[[questions]]
id         = "gw_002"
domain     = "Gravitational Waves / IMBH Physics"
difficulty = "hard"
type       = "phenomenological"
question   = """
Intermediate-mass black holes (IMBHs) are a key science target for
the MBI gravitational-wave group.

(a) Define the IMBH mass range and explain why this population is
    theoretically expected but observationally elusive.  What
    formation channels are proposed?

(b) Describe the gravitational-wave signature of an IMBH–IMBH binary
    merger: in which frequency band does it radiate, what waveform
    morphology is expected, and why is detecting such a signal
    challenging with the current LVK network?
"""
reference_answer = """
(a) IMBH mass range and formation:
IMBHs are conventionally defined as black holes with masses
M ~ 100–10⁵ M_☉ — bridging the gap between stellar-mass BHs
(M ≲ 100 M_☉) from stellar collapse and supermassive BHs (M ≳ 10⁶ M_☉)
at galactic centres.  Their existence resolves the open question of
how SMBHs grew to billions of solar masses by z ~ 6.

Observational evidence is sparse: a few candidates from HLX-1
(~10⁴ M_☉, off-nucleus X-ray source) and the GW event GW190521
(remnant ~150 M_☉, though component masses span the pair-instability
gap).  Electromagnetic detection is difficult because IMBHs are
too massive for stellar-mass X-ray binary diagnostics and too faint
compared to AGN.

Proposed formation channels:
• Runaway stellar collisions in dense young star clusters (massive
  stars collide and merge before supernovae, building up a very
  massive star that collapses directly).
• Hierarchical BH mergers in nuclear star clusters or globular
  clusters — repeated mergers of stellar-mass BHs can grow an IMBH
  over Gyr timescales.
• Direct collapse of massive Population III stars (M_* ≳ 100 M_☉)
  in the early universe.

(b) GW signature of IMBH–IMBH mergers:
For a binary with total mass M_tot, the GW frequency at merger is
roughly f_merger ≈ c³/(6^{3/2} π G M_tot).
For M_tot = 1000 M_☉: f_merger ≈ 10 Hz — at the lower edge of the
LIGO/Virgo band.
For M_tot = 10⁴ M_☉: f_merger ~ 1 Hz — in the LISA / Einstein
Telescope band but below Advanced LIGO's seismic wall (~10 Hz).

Waveform morphology: the inspiral is very short in band (few cycles
visible above 10 Hz for M > 500 M_☉); the merger and ringdown
dominate the detectable signal.  The ringdown is a damped sinusoid
at the quasi-normal mode frequency f_QNM ∝ 1/M, decaying on
timescale τ ∝ M.

LVK detection challenges:
• Short in-band duration (milliseconds to seconds) means matched
  filtering relies on accurate numerical-relativity merger waveforms.
• High mass → low frequency → increased seismic and Newtonian noise
  limits LVK sensitivity below ~20 Hz.
• Non-Gaussian transient glitches mimic short-duration IMBH signals.
• Template placement in parameter space is sparse at high mass,
  reducing search efficiency.
"""

[[questions]]
id         = "gw_003"
domain     = "Gravitational Waves / Einstein Telescope"
difficulty = "hard"
type       = "technological"
question   = """
The Einstein Telescope (ET) is a planned third-generation gravitational-
wave observatory in Europe, targeting first light around 2035.

(a) Describe the key design differences between ET and the current
    Advanced LIGO/Virgo (2G) detectors: geometry, arm length, cryogenics,
    and the dual-band ("xylophone") topology.

(b) What new astrophysical and cosmological science cases become
    accessible with ET that are beyond the reach of current 2G detectors?
"""
reference_answer = """
(a) ET design compared to Advanced LIGO/Virgo:

Geometry: ET uses an equilateral triangular layout (10 km sides),
housing three V-shaped detector pairs rotated by 60° inside a single
tunnel.  The triangle provides full sky coverage without null
directions and gives three independent GW data streams, enabling
on-site subtraction of Newtonian noise.

Arm length: 10 km (vs. 3–4 km for current 2G detectors), directly
improving low-frequency strain sensitivity as h_min ∝ 1/L.

Cryogenics (ET-LF component): silicon test masses cooled to ~10–20 K
suppress thermal noise (Brownian motion ∝ √T) in the 2–30 Hz band.
Silicon optics are required because fused silica becomes absorptive
at the planned 1550 nm laser wavelength compatible with silicon mirrors
at cryogenic temperatures.

Dual-band "xylophone" design: each of the three detector pairs
consists of two co-located but independent interferometers:
• ET-LF (low-frequency): cryogenic, 10 km arms, optimised for 2–30 Hz
  (suppresses radiation-pressure noise).
• ET-HF (high-frequency): room temperature, high laser power, squeezed
  light, optimised for 30–10 000 Hz (suppresses shot noise).
Together they achieve broadband coverage 2 Hz – 10 kHz at target
sensitivity ~10× better than Advanced LIGO at all frequencies.

(b) New science cases:
• Cosmography: detect binary neutron star (BNS) mergers to z ~ 2
  (vs. z ~ 0.1 for 2G), enabling a GW-only Hubble constant measurement
  at sub-percent precision by accumulating ~10⁵ events with known
  luminosity distance.
• Population III and IMBH mergers: access to the 2–30 Hz band reveals
  BH mergers with M > 500 M_☉ (invisible to 2G due to seismic wall).
• Continuous GWs from rapidly rotating neutron stars: improved
  sensitivity reduces the minimum detectable ellipticity to ε ~ 10⁻⁹.
• Post-merger neutron star oscillations (f ~ 2–4 kHz): constrain the
  dense-matter equation of state via f-mode frequencies.
• Stochastic GW background from early-universe phase transitions or
  cosmic strings down to Ω_GW ~ 10⁻¹³.
• Dark matter imprints on waveforms (see gw_005): SNR large enough
  to detect sub-percent phase deviations from dark matter environments.
"""

[[questions]]
id         = "gw_004"
domain     = "Gravitational Waves / Data Analysis"
difficulty = "hard"
type       = "phenomenological"
question   = """
Matched filtering is the core algorithm used by the LVK collaboration
to detect gravitational-wave signals in noisy detector data.

(a) Derive the optimal matched filter signal-to-noise ratio (SNR) for
    a known waveform template in stationary Gaussian noise, defining
    the noise-weighted inner product.

(b) Explain how template banks are constructed for compact binary
    coalescence (CBC) searches, what waveform families are used as
    templates, and how machine-learning approaches are beginning to
    complement or replace matched filtering.
"""
reference_answer = """
(a) Optimal matched filter SNR:
For detector output s(t) = h(t) + n(t), where h is the GW signal and
n is stationary Gaussian noise with one-sided power spectral density
S_n(f), the matched filter cross-correlation of s with template
h̃(t) is
  ρ = ⟨s, h⟩ / √⟨h, h⟩
where the noise-weighted inner product is defined as
  ⟨a, b⟩ = 4 Re ∫_0^∞ ã*(f) b̃(f) / S_n(f) df
(ã denotes the Fourier transform of a).
This is the Wiener optimal filter; it weights frequency bins inversely
by noise power, suppressing noisy bands automatically.  The maximum
SNR over coalescence time t_c is achieved by computing ρ(t_c) as a
convolution (implemented via FFT for efficiency).  For a signal
identical to the template, the expected SNR is
  ρ_opt = √⟨h, h⟩ = √(4 ∫_0^∞ |h̃(f)|² / S_n(f) df).

(b) Template banks and waveform families:
A CBC search requires templates covering the parameter space
(m_1, m_2, χ_1, χ_2, …) densely enough that no signal loses more
than a fraction δ (mismatch ≤ 3% typical) of its optimal SNR.  Banks
are placed using:
• Geometric / stochastic methods: tiles in the chirp-mass / mass-ratio
  plane; O(10⁵–10⁶) templates for the full O3 LVK search.
• The chirp mass M_c = (m_1 m_2)^{3/5}/(m_1+m_2)^{1/5} sets the GW
  frequency evolution df/dt ∝ M_c^{5/3} f^{11/3} and is measured
  most precisely.

Waveform families used:
• Post-Newtonian (PN) inspiral: Taylor T4/F2, valid for v/c ≪ 1
  (f ≪ f_ISCO).  Systematic series in v/c expanded to 3.5PN in phase.
• Effective-one-body (EOB, e.g. SEOBNRv4, TEOBResumS): maps the
  two-body problem onto a test particle in an effective Kerr metric;
  matched to numerical relativity (NR) for merger/ringdown.
• Phenomenological (IMRPhenomD/X): closed-form frequency-domain fits
  calibrated to hybrid PN+NR waveforms; fast to evaluate.

Machine-learning approaches:
• Deep-learning classifiers (CNN, ResNet) trained on simulated signals
  in real noise to replace the χ² signal-consistency test and veto
  glitches, improving detection efficiency at low SNR.
• Rapid parameter estimation via normalising flows (e.g. DINGO,
  RIFT-based) that replace MCMC/nested sampling (hours → seconds).
• FPGA-accelerated matched filter pipelines (PyCBC, MBTAmulti) already
  deployed in low-latency O3/O4; ML inference on FPGAs is an active
  MBI research direction.
"""

[[questions]]
id         = "gw_005"
domain     = "Gravitational Waves / Dark Matter"
difficulty = "medium"
type       = "phenomenological"
question   = """
The MBI gravitational-wave group investigates how dark matter (DM)
could influence the waveform produced in the coalescence of
intermediate-mass black holes (IMBHs).

(a) Describe two distinct physical mechanisms by which dark matter
    could alter the inspiral gravitational waveform of a binary black
    hole system, and state which waveform observable each mechanism
    affects.

(b) What observational strategies or waveform analysis techniques
    could the Einstein Telescope use to search for these dark matter
    imprints, and what DM models would be most sensitively probed?
"""
reference_answer = """
(a) Two dark-matter mechanisms affecting GW waveforms:

1. Dynamical friction from a DM density spike:
If a black hole sits at the centre of a DM density spike
(ρ_DM ∝ r^{−γ} with γ ~ 7/3 for an adiabatically grown spike around
a pre-existing BH), the orbiting companion experiences a drag force
  F_df = −4π G² m² ρ_DM(r) ln Λ / v²
(Chandrasekhar formula), where ln Λ is the Coulomb logarithm.
This removes orbital energy in addition to GW emission, accelerating
the inspiral and producing a phase advance ΔΨ in the waveform
(accumulated GW cycles are fewer than in vacuum).  For a 10³ M_☉
IMBH with a dense DM spike, ΔΨ ~ 10–10⁴ radians over the inspiral —
detectable as a deviation from the vacuum inspiral template.  The
effect grows at low orbital frequencies and is encoded primarily in
the GW phase at early inspiral.

2. Ultralight boson (dark photon / axion) cloud — superradiance:
A rotating BH can spontaneously grow a cloud of ultralight bosons
(mass μ_b ~ 10⁻¹³–10⁻¹⁰ eV for optimal spin-down of IMBH-range BHs)
via the Penrose–Blandford-Znajek superradiance instability, extracting
rotational energy.  The resulting gravitational atom emits a
quasi-monochromatic continuous GW at frequency f ~ μ_b c²/h ≈ 24 Hz
(μ_b c² ~ 10⁻¹³ eV).  In a binary, the cloud is tidally disrupted
during inspiral, injecting angular momentum and producing a
measurable floating orbit or resonance feature in the GW frequency
evolution (dephasing at specific orbital separations where the
orbital frequency matches a boson level transition).  This modifies
both the amplitude and phase of the inspiral waveform.

(b) ET observational strategies and DM models probed:

Strategies:
• Beyond-GR / beyond-vacuum parametrised tests: extend the
  post-Newtonian waveform with extra phase coefficients
  δψ_n at each PN order (ppE — parametrised post-Einsteinian
  framework); DM-driven forces appear as anomalous non-GR terms
  at specific PN orders (dynamical friction enters at −4PN relative
  to the leading GW term for EMRI-like systems).
• Matched filtering against DM-extended waveform templates:
  compute Bayes factors comparing vacuum vs. spike/boson-cloud
  models; ET's high SNR (ρ ~ 100–1000 for nearby IMBH mergers)
  makes phase deviations of ΔΨ ≳ 1 radian detectable.
• Continuous-wave searches for superradiance emission: look for
  quasi-monochromatic signals from isolated BHs before binary
  interaction using standard Hough-transform or semicoherent methods.

DM models most sensitively probed:
• DM spikes around IMBHs: particle DM with σv ≲ 10⁻²⁶ cm³/s
  (annihilation rates that do not deplete the spike).
• Ultralight bosons: boson masses μ_b c² ~ 10⁻¹⁴–10⁻¹¹ eV for
  BHs of 10²–10⁵ M_☉ (gravitational-atom resonance condition).
• Fuzzy/wave DM: de Broglie wavelength comparable to binary
  separation → oscillating Newtonian potential imprinted on phase.
ET's 10-km arms and 2 Hz seismic wall are critical for detecting
the low-frequency inspiral phase where DM effects accumulate most.
"""

