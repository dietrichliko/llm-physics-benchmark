# ─────────────────────────────────────────────────────────────────────────────
# CMS Experiment — Data Analysis Group  (5 questions)
# Source: https://www.oeaw.ac.at/en/mbi/research/cms-experiment-at-the-lhc/data-analysis-group
# MBI focus: H→ττ observation; long-lived dark photons / displaced vertices;
#            top quark anomalous couplings (tZ, tγ); p_T^miss significance;
#            compressed SUSY spectra (ISR, MT2), SModelS interpretation
# 3 phenomenological  |  2 experimental / technological
# ─────────────────────────────────────────────────────────────────────────────

[[questions]]
id         = "cms_001"
domain     = "CMS / Higgs Physics"
difficulty = "hard"
type       = "phenomenological"
question   = """
The MBI CMS Data Analysis group led the CMS observation of H→ττ
during LHC Run 2.

(a) Explain why H→ττ is an important channel for probing BSM physics
    and describe the four τ-pair final states (decay channels) used
    in CMS, their relative branching fractions, and the main
    background processes that must be controlled in each.

(b) Describe the multivariate analysis strategy used to separate the
    H→ττ signal from the dominant Z→ττ background — why these two
    processes are experimentally so similar and what discriminating
    variables break the degeneracy.
"""
reference_answer = """
(a) Importance and final states:
H→ττ has a branching fraction of ~6.3% (the largest leptonic Higgs
decay), making it the primary channel to directly measure the
Higgs coupling to third-generation leptons (Yukawa coupling y_τ).
The τ Yukawa is particularly sensitive to BSM modifications of the
Higgs sector: Type-II 2HDMs and MSSM predict y_τ enhanced at large
tan β, while composite Higgs models predict y_τ reduced from the SM.

The four ττ final states (ordered by sensitivity / complexity):
1. μτ_h (BR ~ 22.5%): one muon, one hadronically decaying tau
   (τ_h). The μ is clean; the dominant background is Z→ττ and
   W+jets (fake τ_h).  Best sensitivity per event.
2. eτ_h (BR ~ 23%): one electron, one τ_h.  Similar to μτ_h
   but with additional e→τ_h fakes from DY Z→ee.
3. τ_hτ_h (BR ~ 42%): both taus decay hadronically.  Highest
   branching fraction but hardest to trigger; large QCD
   multi-jet background where both jets are mis-identified as τ_h.
4. eμ (BR ~ 6.4%): one electron and one muon from separate ττ
   branches.  Clean signature; dominant background is tt̄ →
   bℓ bℓ (opposite-sign dileptons with neutrinos), not Z→ττ.

Main backgrounds: Z→ττ (irreducible, same final state), W+jets
(fake τ_h), QCD multi-jet (both jets faking τ_h in τ_hτ_h), tt̄.
The QCD and W+jets backgrounds are estimated data-driven using
same-sign or anti-isolation control regions.

(b) Signal vs. Z→ττ separation:
H→ττ and Z→ττ produce identical visible final states (the neutrinos
from τ decays escape detection in both cases), making them
experimentally almost indistinguishable event by event.  The key
difference is the invariant mass: m_H = 125 GeV vs. m_Z = 91 GeV.
However, neutrinos make direct m_ττ reconstruction impossible.

CMS uses the SVfit algorithm: a likelihood-based ττ mass
reconstruction that integrates over the unknown neutrino momenta
using the τ decay matrix element and p_T^miss as a constraint,
producing m_ττ^SVfit with ~15% resolution — sufficient to separate
the H and Z peaks.

Multivariate discrimination:
A boosted decision tree (BDT) or deep neural network is trained to
separate ggH/VBF H→ττ from Z→ττ using:
• m_ττ^SVfit — the primary discriminant (~34 GeV separation).
• p_T^{ττ} or D_ζ = p_ζ^{vis} − 0.85 p_ζ^{miss} — the component
  of p_T^miss along the ττ bisector; collinear for Z, more
  transverse for H (due to different boost).
• m_{jj}, Δη_{jj} for VBF categories to exploit the large
  rapidity gap between tagging jets.
• p_T of the Higgs candidate system (VH, ttH categories).
The analysis is split into mutually exclusive categories (VBF,
boosted, 0-jet) based on jet multiplicity and kinematics, each
with a separate BDT score used as the final discriminant in a
simultaneous maximum-likelihood fit.  CMS Run 2 result:
significance = 5.5σ, κ_τ = 0.85 ± 0.12.
"""

[[questions]]
id         = "cms_002"
domain     = "CMS / Long-Lived Particles"
difficulty = "hard"
type       = "experimental"
question   = """
The MBI CMS Data Analysis group searches for long-lived dark photons
produced in Higgs decays via displaced muon-pair signatures.

(a) Describe the theoretical motivation: through what Higgs portal
    coupling can a pair of dark photons A' be produced, what lifetime
    range is theoretically natural, and what final-state topology
    results when each A' decays to a muon pair?

(b) Explain how the CMS detector — combining the inner silicon tracker
    and the outer muon spectrometer — is used to reconstruct displaced
    vertices over a range of proper decay lengths from millimetres
    to several metres, and what the dominant backgrounds are in each
    displacement regime.
"""
reference_answer = """
(a) Higgs portal and signal topology:
The hidden-valley / dark-sector scenario extends the SM with a new
U(1)_D gauge boson A' (dark photon) that couples to SM particles
via kinetic mixing ε.  The Higgs can decay via a BSM scalar
mediator S (mixing angle θ with H): H → SS → A'A'A'A', or more
simply through a direct loop-induced H → A'A' coupling.  In
hidden-valley models with a light pseudo-scalar a, the chain is
  H → aa,   a → A'A',   A' → μ⁺μ⁻ (or e⁺e⁻, π⁺π⁻),
resulting in four muons emerging from two displaced vertices.

The A' lifetime is:
  cτ_{A'} ≈ (3 × 10⁻³ mm) × (10⁻⁴/ε)² × (1 GeV/m_{A'})
For ε ~ 10⁻⁵–10⁻³ and m_{A'} ~ 0.3–60 GeV, cτ ranges from
~μm to ~100 m — spanning the full CMS detector volume.
This is theoretically natural from string-landscape estimates of ε.

CMS sensitivity window: cτ ~ 0.1 mm to ~10 m, beyond which the
A' escapes the detector (invisible); below ~0.1 mm the vertex
is indistinguishable from prompt production.
BR(H→A'A') constrained to ≲ 1% by signal-strength measurements;
current CMS results provide the world's best limits in large
regions of the (ε, m_{A'}) plane.

(b) Displaced vertex reconstruction across displacement regimes:

Short displacements (cτ ≲ 10 cm — inner tracker):
The silicon pixel and strip tracker reconstructs secondary vertices
with position resolution ~100 μm (transverse).  Displaced muon
tracks are identified by their large transverse impact parameter
d_0 > 1 mm relative to the primary vertex, and refitted to a
common vertex.  Invariant mass m_μμ of the displaced pair provides
a resonance signal at m_{A'}.  Background: b-hadron semi-leptonic
decays (displaced vertices with Δxy ~ few mm) and in-flight kaon
decays — suppressed by requiring the vertex to be isolated from
jets and passing strict quality cuts.

Long displacements (10 cm ≲ cτ ≲ few m — muon system):
The CMS muon spectrometer (DT, CSC, RPC chambers at r = 4–7 m)
reconstructs displaced muon segment pairs consistent with emerging
from a common point outside the tracker volume.  The analysis
uses the "displaced standalone muon" algorithm — reconstructing
muon tracks using only muon system hits, without silicon tracker
seeds — with the origin point floating.  This extends sensitivity
to proper decay lengths up to ~6 m.  Background: cosmic-ray muons
(rejected by timing and back-to-back geometry) and accidental
combinations of punch-through hadrons.

Combination: a simultaneous search across both regimes — using a
2-D likelihood in (d_{xy}, m_μμ) — gives sensitivity over five
decades of proper lifetime, setting limits on ε² as a function
of m_{A'} unmatched by any other experiment.
"""

[[questions]]
id         = "cms_003"
domain     = "CMS / Top Quark Physics"
difficulty = "hard"
type       = "phenomenological"
question   = """
The MBI CMS Data Analysis group measures anomalous couplings of the
top quark to electroweak gauge bosons through differential cross
sections and photon spectrum studies.

(a) Define the effective field theory (EFT) operators that parametrise
    anomalous top–Z and top–photon (tZq, tγq) couplings, specifically
    the electric and magnetic dipole moments of the top quark.  How do
    these operators modify the production cross sections and
    kinematic distributions of associated tZ and tγ production?

(b) Describe two CMS observables — the Z boson transverse momentum
    distribution in tt̄Z events and the photon pT spectrum in tt̄γ
    events — that are sensitive to these anomalous couplings, and
    explain what systematic effects limit the precision of each
    measurement.
"""
reference_answer = """
(a) EFT operators for anomalous top EW couplings:
In the SM effective field theory (SMEFT) at dimension-6, the
top quark's coupling to photons and Z bosons is modified by
two classes of operators:

Magnetic dipole moment (chromomagnetic / electromagnetic):
  O_{tZ} = (g/c_W) (Q̄_L σ^{μν} t_R) φ̃ Z_{μν} + h.c.
  O_{tγ} = e (Q̄_L σ^{μν} t_R) φ̃ F_{μν} + h.c.
These operators add a tensor (σ^{μν} q_ν) coupling at the ttZ or
ttγ vertex, contributing an anomalous magnetic moment (κ) for the
top quark:
  κ_t^γ = form factor from c_{tγ}/Λ²,
  κ_t^Z  analogously.

Electric dipole moment (CP-violating):
  O_{tZ}^{(I)} = (g/c_W) (Q̄_L σ^{μν} i t_R) φ̃ Z_{μν} + h.c.
contributes an electric dipole moment d_t^γ that violates CP.

Effect on cross sections and kinematics:
• At high p_T (photon or Z), the tensor coupling grows with the
  vertex momentum transfer Q: amplitude ∝ (c_{tγ}/Λ²) Q, so
  anomalous contributions are enhanced at large transverse momenta —
  the differential cross section dσ/dp_T^γ or dσ/dp_T^Z is the
  primary sensitive observable.
• CP-odd operators produce an azimuthal asymmetry A_{CP} in the
  tt̄Z final state reconstructable from the Z decay angle.

(b) Key CMS observables and systematics:

1. p_T(Z) in tt̄Z:
CMS measures the differential cross section dσ/dp_T^Z using the
trilepton channel (tt̄ → bℓν b qq̄, Z → ℓ⁺ℓ⁻) or four-lepton
channel with ~140 fb⁻¹.  Anomalous couplings enhance the high-p_T
tail (p_T^Z > 200 GeV) where the SM has few events.  A matrix
element method or BDT reweighting maps observed p_T^Z distributions
to Wilson coefficient constraints via a profile likelihood scan.

Dominant systematics:
• Jet energy scale and resolution (~2%): affects tt̄ reconstruction
  and lepton-b jet assignments, shifting p_T^Z via recoil balance.
• b-tagging efficiency SF (2–5%): controls the tt̄ combinatorial
  background.
• WZ, ZZ theoretical QCD scale uncertainties (~5–10%): these
  produce irreducible diboson + jets events mimicking tt̄Z.
• Pile-up modelling at high luminosity (Run 2 μ ~ 40).

2. Photon p_T in tt̄γ:
CMS measures dσ/dp_T^γ in the single-lepton + jets + γ channel.
The SM predicts a steeply falling spectrum; anomalous κ_t^γ ≠ 1
enhances the tail above p_T^γ ~ 100 GeV.  Results constrain:
  −0.14 < κ_t^γ < 0.15 (95% CL, Run 2).
Dominant systematics:
• Photon energy resolution and scale (~1%, from Z→eeγ FSR data).
• Prompt vs. fake photon discrimination (fragmentation photons from
  jets): controlled by isolation requirements in (ΔR, E_T) space.
• tt̄ + γ NLO QCD modelling: the shape of the SM spectrum at NLO
  is uncertain at 10–20% for p_T^γ > 200 GeV.
"""

[[questions]]
id         = "cms_004"
domain     = "CMS / Missing Energy"
difficulty = "medium"
type       = "experimental"
question   = """
The MBI CMS Data Analysis group developed the p_T^{miss} significance
observable to improve sensitivity to invisible particles in the
presence of varying pile-up.

(a) Define p_T^{miss} significance in CMS: how is it constructed from
    the p_T^{miss} vector and the covariance matrix of the hadronic
    recoil, and how does it differ from the simple p_T^{miss} magnitude
    as a discriminant against QCD multi-jet backgrounds?

(b) Explain how p_T^{miss} significance is used in SUSY and dark matter
    searches at CMS — specifically in analyses targeting compressed
    mass spectra — and what pile-up conditions make it especially
    advantageous compared to a fixed p_T^{miss} threshold.
"""
reference_answer = """
(a) p_T^{miss} significance: definition and advantage:
The missing transverse momentum p_T^{miss} is the negative vector
sum of all reconstructed particle-flow objects (charged tracks,
neutral hadrons, photons, leptons, jets) in the transverse plane:
  p_T^{miss} = −Σ_i p_T^i.

In QCD multi-jet events, large apparent p_T^{miss} arises from
mismeasurement of individual jet energies (Gaussian fluctuations
and tails of the jet energy resolution).  For N jets each with
energy resolution σ_i, the resolution on each component of p_T^{miss}
is approximately:
  σ(p_T^{miss},x) = √(Σ_i σ²_i cos²φ_i),
quantified by the covariance matrix V of the hadronic recoil.

p_T^{miss} significance S:
  S = (p_T^{miss})^T V^{-1} (p_T^{miss}),
which in the Gaussian limit is distributed as χ²(2) under the
null hypothesis of no true missing energy.  S effectively measures
"how many σ" the observed p_T^{miss} is from zero given the
per-event resolution.

Advantage over |p_T^{miss}|:
• A fixed threshold |p_T^{miss}| > X retains the same absolute rate
  of QCD mismeasurement events regardless of event topology.
  S > X_S rejects events where large |p_T^{miss}| arises from a
  single poorly-measured jet (σ_i large → V large → S small).
• In events with genuine missing energy (neutrinos, χ̃⁰₁), the true
  p_T^{miss} is uncorrelated with the hadronic resolution → S
  can be large even for moderate |p_T^{miss}|, preserving signal.
• S is approximately pile-up independent: pile-up increases both
  |p_T^{miss}| and σ_i proportionally, leaving S stable.  This
  allows lower effective p_T^{miss} thresholds at high luminosity.

(b) Application to compressed SUSY and DM searches:

Compressed mass spectra:
When the mass difference between the produced SUSY particle and
the LSP is small (Δm ≲ 30 GeV), decay products are too soft to
reconstruct efficiently.  Sensitivity relies on initial-state
radiation (ISR): an energetic jet or photon from the hard process
recoils against the χ̃χ̃ system, boosting the LSPs and producing
genuine p_T^{miss}.  However, the ISR jet also contributes large
energy to the hadronic recoil, increasing σ(p_T^{miss}) and
reducing the standard |p_T^{miss}| significance.

p_T^{miss} significance in this context:
• CMS uses S as the primary discriminant in compressed stop
  (t̃₁ → c χ̃⁰₁ or t̃₁ → t* χ̃⁰₁ with Δm < m_t) and gluino
  searches, combined with kinematic variables like MT2(ℓℓ).
• At Run 3 pile-up conditions (μ ~ 50–60), the particle-flow
  algorithm degrades p_T^{miss} resolution; S remains robust
  because V is computed event-by-event from the actual jet
  response widths, not a global average.
• Signal efficiency vs. background rejection ROC curves show
  S outperforms a fixed |p_T^{miss}| cut by 20–40% in signal
  efficiency at fixed background rejection in the compressed
  stop search region.
"""

[[questions]]
id         = "cms_005"
domain     = "CMS / SUSY Searches"
difficulty = "hard"
type       = "phenomenological"
question   = """
The MBI CMS Data Analysis group searches for top squarks and gluinos
in compressed mass spectra and interprets results with the SModelS
framework.

(a) Explain the MT2(ℓℓ) kinematic variable used in dilepton SUSY
    searches: how it is defined, what kinematic endpoint it provides
    for tt̄ background, and why events with genuine invisible particles
    (χ̃⁰₁) can exceed this endpoint.

(b) Describe the SModelS approach to BSM model interpretation: how
    it decomposes an arbitrary SUSY spectrum into simplified model
    topologies (SMS), maps these to experimental upper-limit tables,
    and what the "protomodels" algorithm adds to identify dispersed
    multi-search excesses.
"""
reference_answer = """
(a) MT2(ℓℓ) variable:
In dileptonic tt̄ events (tt̄ → bℓν b ℓ̄ν̄), two neutrinos escape
detection.  The stransverse mass MT2 is defined as:
  MT2(ℓℓ) = min_{p_T^{ν₁}+p_T^{ν₂}=p_T^{miss}} max[M_T(ℓ₁,ν₁), M_T(ℓ₂,ν₂)]
where M_T(ℓ,ν) = √(2 p_T^ℓ p_T^ν (1−cosΔφ)) is the transverse
mass and the minimisation is over all splittings of p_T^{miss}
between the two invisible particles (here neutrinos).  Setting the
invisible particle mass to 0, the kinematic endpoint of MT2(ℓℓ)
for SM tt̄ is:
  MT2^{max}(ℓℓ) ≤ m_W ≈ 80.4 GeV,
because each ℓν pair comes from a W decay; the endpoint is sharp
for massless neutrinos.

Signal region beyond the endpoint:
For t̃₁t̃₁* → (bℓν χ̃⁰₁)(b ℓ̄ν̄ χ̃⁰₁), there are four invisible
particles per event (2ν + 2χ̃⁰₁).  Minimising over the total
invisible system shifts the effective endpoint upward:
  MT2^{max}(ℓℓ) → m_{t̃} − m_{χ̃⁰₁} (for massless χ̃⁰₁ limit)
For Δm = m_{t̃} − m_{χ̃⁰₁} > m_W, signal events populate the
region MT2(ℓℓ) > m_W — a kinematic tail that is exponentially
suppressed for SM tt̄.  For compressed spectra (Δm ~ 30–80 GeV),
the separation from tt̄ is reduced; CMS combines MT2(ℓℓ) > 80 GeV
with p_T^{miss} significance and a soft-lepton p_T requirement
to maintain sensitivity at small Δm.

CMS Run 2 dilepton stop result: m_{t̃} > 700 GeV for m_{χ̃⁰₁} = 1
GeV (simplified model); sensitivity degrades to m_{t̃} > 540 GeV
at Δm = 30 GeV.

(b) SModelS and protomodels:

SModelS framework:
SModelS is a public code (co-developed by MBI) that takes an
arbitrary BSM model defined by its Lagrangian or spectrum file
(SLHA format) and:
1. Decomposes all pair-produced sparticle cascades into SMS
   topologies — two-body decay chains represented as directed
   graphs with at most one BSM particle per branch ("simplified
   model").
2. For each topology, computes the production cross section
   × branching ratio for each SMS component using NLO+NLL
   K-factors from NLLfast.
3. Queries a database of ~200 CMS and ATLAS simplified model
   results (provided as upper-limit (UL) or efficiency-map (EM)
   tables in terms of mass parameters) to check whether each
   SMS contribution is excluded.
4. Computes r = σ_theory / σ^{95%CL}_{obs}; r > 1 excludes the
   parameter point.

SModelS enables rapid, automated constraint of high-dimensional
SUSY parameter spaces (e.g. pMSSM-11 with ~10⁸ points) against
the full set of LHC searches without rerunning full detector
simulation.

Protomodels algorithm:
Rather than testing individual model points, the protomodels
approach identifies BSM models that collectively explain small
(1–2σ) excesses dispersed across multiple search channels.  The
algorithm:
1. Scans experimental results for locally significant (≳1.5σ)
   deviations from SM expectations in the EMs database.
2. Constructs "protomodel" parameter points (simplified spectra)
   that predict excess contributions in the identified channels
   simultaneously, using a likelihood combination.
3. Evaluates the combined local significance and checks for
   consistency with exclusion results (r < 1 globally).
This provides a data-driven, model-agnostic scan for coherent
multi-channel BSM signals below the per-channel discovery
threshold — complementary to model-specific interpretations.
"""

# ─────────────────────────────────────────────────────────────────────────────
# ALICE Experiment at LHC  (5 questions)
# Source: https://www.oeaw.ac.at/en/mbi/forschung/alice-experiment-at-lhc
# Physics: QGP, hadronisation, strong force in heavy-ion collisions
# 3 phenomenological  |  2 experimental / technological
# ─────────────────────────────────────────────────────────────────────────────

[[questions]]
id         = "alice_001"
domain     = "ALICE / QGP Phenomenology"
difficulty = "hard"
type       = "phenomenological"
question   = """
The ALICE experiment at the LHC studies the Quark-Gluon Plasma (QGP),
a deconfined state of strongly-interacting matter produced in Pb-Pb
collisions.

(a) Sketch the QCD phase diagram (temperature T vs. baryon chemical
    potential μ_B).  Where do LHC heavy-ion collisions sit on this
    diagram, and what does lattice QCD predict for the deconfinement
    temperature at μ_B ≈ 0?

(b) Name and briefly explain four experimental signatures used by ALICE
    to confirm QGP formation.
"""
reference_answer = """
(a) QCD phase diagram and LHC conditions:
The horizontal axis is μ_B (baryon chemical potential); the vertical
axis is temperature T. At low T and low μ_B: hadronic matter (confined
quarks). As T increases at μ_B ≈ 0, lattice QCD finds a smooth
crossover — not a sharp first-order transition — to the QGP at a
pseudo-critical temperature T_c ≈ 155 MeV (~1.8 × 10¹² K). At large
μ_B (dense nuclear matter) models predict a first-order phase boundary
ending at a critical point, but its location is not yet experimentally
confirmed. LHC Pb-Pb collisions at √s_NN = 5.02 TeV produce matter at
T ≫ T_c with μ_B ≈ 0 (equal amounts of matter and antimatter) — the
upper-left corner of the diagram.

(b) Four QGP signatures measured by ALICE:

1. Jet quenching — Hard-scattered partons lose energy in the dense
   colour medium via gluon bremsstrahlung (BDMPS mechanism) and
   collisional scattering.  Observed as R_AA ≪ 1 for high-p_T
   (>5 GeV/c) charged hadrons and jets in central Pb-Pb collisions.

2. Strangeness enhancement — At T > T_c, gluon fusion gg→ss̄ produces
   strange quarks in thermal equilibrium.  ALICE sees enhanced yields
   of K, Λ, Ξ, Ω per participant relative to pp; the enhancement grows
   with the number of strange valence quarks (factor ~5 for Ω).

3. Collective elliptic flow (v₂) — The almond-shaped initial overlap
   region drives azimuthally anisotropic pressure gradients; the
   resulting v₂ ≈ 6–15% is quantitatively reproduced only by viscous
   relativistic hydrodynamics with η/s ≈ 1/(4π), indicating a
   strongly-coupled, nearly perfect liquid.

4. J/ψ suppression and regeneration — Colour-Debye screening dissolves
   J/ψ (cc̄) bound states in the QGP.  At LHC energies the abundant
   charm quarks also recombine at hadronisation, producing a low-p_T
   J/ψ excess (regeneration) on top of the high-p_T suppression.
"""

[[questions]]
id         = "alice_002"
domain     = "ALICE / QGP Phenomenology"
difficulty = "hard"
type       = "phenomenological"
question   = """
Elliptic flow v₂ is one of the key observables connecting ALICE data
to the properties of the QGP.

(a) Define v₂ via the Fourier decomposition of the single-particle
    azimuthal distribution and explain its physical origin in non-central
    heavy-ion collisions.

(b) How is v₂ measured experimentally in ALICE, and what does the
    quantitative agreement with viscous hydrodynamics imply for the
    shear-viscosity-to-entropy-density ratio η/s of the QGP?
"""
reference_answer = """
(a) Definition and physical origin:
The single-particle azimuthal distribution is expanded as
  dN/dφ ∝ 1 + 2∑_n v_n cos[n(φ − Ψ_n)]
where φ is the particle azimuth and Ψ_n the n-th order symmetry plane.
v₂ (second harmonic, elliptic flow) is dominant in collisions with
finite impact parameter b. The initial nuclear overlap is spatially
anisotropic (almond-shaped, with the short axis along the reaction
plane). Pressure gradients are strongest along the short axis, driving
stronger collective acceleration in that direction and converting the
initial spatial eccentricity into final-state momentum anisotropy.

(b) Measurement and η/s extraction:
Methods used in ALICE:
• Event-plane method: Ψ₂ is reconstructed from VZERO (forward
  scintillator) or ZDC (zero-degree calorimeter) signals to suppress
  non-flow contributions; v₂{EP} = ⟨cos 2(φ−Ψ₂)⟩/resolution.
• Multi-particle cumulants: v₂{4}, v₂{6}… suppress short-range
  (non-flow) correlations from resonance decays and jets.
• Scalar-product method: combines tracker and forward detectors with an
  η gap.

At √s_NN = 5.02 TeV (Pb-Pb), ALICE measures v₂ ≈ 6–15% at p_T ~ 3
GeV/c in mid-central collisions.  Viscous hydrodynamic codes (VISHNU,
MUSIC) with IP-Glasma or T_RENTo initial conditions reproduce the data
only if the QGP shear viscosity satisfies
  η/s ≈ 0.08–0.20,
where the lower bound 1/(4π) ≈ 0.08 is the AdS/CFT "KSS" quantum
lower bound.  This is 2–3 orders of magnitude smaller than liquid
helium or water, making the QGP the most perfect liquid known.
"""

[[questions]]
id         = "alice_003"
domain     = "ALICE / Hadronisation"
difficulty = "medium"
type       = "phenomenological"
question   = """
The ALICE group studies hadronisation — the transition from the
colour-deconfined QGP into observable hadrons.

(a) Contrast two theoretical descriptions of hadronisation: the Lund
    string fragmentation model (PYTHIA) and the statistical thermal
    hadronisation model.

(b) How do measurements of the baryon-to-meson ratio (e.g. p/π or
    Λ/K⁰_S) at intermediate p_T in Pb-Pb collisions challenge the
    simple string-fragmentation picture?
"""
reference_answer = """
(a) Two hadronisation models:

Lund string fragmentation (PYTHIA / JETSET):
A colour flux tube of tension κ ≈ 1 GeV/fm stretches between a
separating quark-antiquark pair.  When the string stores enough energy,
it breaks by spontaneous qq̄ pair creation from the vacuum (Schwinger
mechanism), producing new hadrons whose p_T and species are governed
by independent fragmentation functions tuned to e⁺e⁻ data.  The model
works well in pp collisions but does not include a thermally-equilibrated
bulk medium.

Statistical thermal hadronisation (Andronic, Braun-Munzinger, Redlich):
If a QGP fireball reaches chemical equilibrium, hadron abundances at
chemical freeze-out (T_ch ≈ 155 MeV, μ_B ≈ 0 at LHC) are fixed by a
grand-canonical ensemble.  Particle ratios (K/π, p/π, Ω/π …) are
determined solely by T_ch and reproduce Pb-Pb yield data remarkably
well.

(b) The baryon anomaly at intermediate p_T:
In central Pb-Pb at p_T ≈ 2–5 GeV/c, the p/π and Λ/K⁰_S ratios
exceed both the string-fragmentation baseline and the thermal model
prediction.  This "baryon anomaly" is attributed to two mechanisms:

• Radial flow: collective expansion boosts heavier particles (baryons)
  to higher p_T, shifting the proton and Λ spectra toward larger p_T
  compared to pions.

• Quark recombination / coalescence: co-moving quarks in the QGP can
  combine (recombine) into hadrons at hadronisation; the rate scales as
  n_q^{B/M} (density to the baryon/meson power), predicting a
  baryon/meson enhancement at intermediate p_T that vanishes at high
  p_T where jet fragmentation dominates.

At high p_T (>6 GeV/c) the ratio returns to the fragmentation value,
consistent with this picture.
"""

[[questions]]
id         = "alice_004"
domain     = "ALICE / Detector Technology"
difficulty = "hard"
type       = "experimental"
question   = """
The ALICE Time Projection Chamber (TPC) is the central tracking and
particle-identification detector, handling up to 50 000 Pb-Pb
collisions per second in Run 3.

(a) Explain how the TPC reconstructs 3-D tracks and identifies particles
    via energy loss (dE/dx).

(b) What fundamental change was made to the TPC readout for Run 3
    (2022–), and why was this necessary given the ALICE physics programme?
"""
reference_answer = """
(a) TPC operating principle:
The ALICE TPC (inner radius 84 cm, outer radius 247 cm, length 500 cm)
is filled with Ne-CO₂-N₂ (90-10-5%) gas in a 0.5 T solenoidal field.
A charged particle ionises the gas along its trajectory; primary
electrons drift in a uniform ~400 V/cm electric field toward the two
readout endcaps (max. drift length 2.5 m, drift velocity ≈ 2.7 cm/μs).

3-D reconstruction: up to 159 pad-row measurements per track give r-φ
(pad centre position) and z (arrival time × drift velocity) coordinates.
Curvature in the magnetic field yields p_T with ~1–3% resolution.

Particle identification (dE/dx): The ionisation energy loss follows the
Bethe-Bloch formula as a function of βγ = p/(mc).  With ~5–6% dE/dx
resolution, ALICE separates π/K/p up to ≈1–1.5 GeV/c and uses the
relativistic rise for higher-momentum identification.

(b) Run 3 GEM upgrade:
In Run 1/2 the TPC used Multi-Wire Proportional Chambers (MWPCs) with
gating grids that opened only once per L1 trigger, limiting the Pb-Pb
readout rate to ~500 Hz.  The ALICE Run 3 physics programme (rare
probes, charm, beauty) requires accumulating 10–100 nb⁻¹, achievable
only at the full 50 kHz Pb-Pb collision rate.

Solution: both MWPC endcap sectors were replaced with stacks of four
Gas Electron Multiplier (GEM) foils.  GEMs amplify drifting electrons
via avalanches in their micro-holes (100 μm diameter, 140 μm pitch)
while naturally suppressing positive ion back-flow (IBF < 1%) without
any gating grid, enabling fully continuous readout.  New SAMPA ASICs
digitise at 10 MHz; an online GPU+FPGA farm (O² processing) handles
the ~3.4 TB/s raw throughput with real-time track finding and data
compression.
"""

[[questions]]
id         = "alice_005"
domain     = "ALICE / Heavy-Ion Collisions"
difficulty = "hard"
type       = "experimental"
question   = """
The nuclear modification factor R_AA is ALICE's primary observable for
comparing Pb-Pb to pp collisions.

(a) Write the definition of R_AA, state its expected value for processes
    scaling with the number of binary nucleon-nucleon collisions, and
    explain what R_AA ≪ 1 means physically.

(b) ALICE observes qualitatively different R_AA behaviour for (i)
    high-p_T charged hadrons and (ii) J/ψ mesons at low p_T in central
    Pb-Pb at √s_NN = 5.02 TeV.  Describe these measurements and the
    QGP physics they probe.
"""
reference_answer = """
(a) Definition:
  R_AA(p_T) = [d²N_AA / dp_T dη]
              ─────────────────────────────
              ⟨T_AA⟩ × [d²σ_pp / dp_T dη]

where ⟨T_AA⟩ = ⟨N_coll⟩ / σ_inel^NN is the nuclear overlap function
computed from the Glauber model.  For a hard process scaling with
N_coll, no nuclear effects implies R_AA = 1.
R_AA ≪ 1 signals suppression of particle production relative to
independent pp scatterings scaled by N_coll — evidence for
medium-induced effects (energy loss, absorption, screening).

(b) Two contrasting behaviours:

(i) High-p_T charged hadrons (p_T > 5 GeV/c):
ALICE (and CMS/ATLAS) find R_AA ≈ 0.1–0.3 in the 0–5% most central
collisions — a 70–90% suppression.  This is jet quenching: energetic
quarks and gluons produced in hard scattering traverse the QGP and lose
energy via gluon bremsstrahlung (radiative loss ΔE ∝ q̂ L², where q̂
is the jet transport coefficient and L the path length) and elastic
collisions, depleting the high-p_T hadron yield.  R_AA increases toward
peripheral collisions (shorter path length) and approaches 1 in pp,
confirming the medium origin.

(ii) J/ψ at low p_T (p_T < 3 GeV/c):
R_AA(J/ψ) ≈ 0.5–0.7 and rises as p_T → 0, opposite to the naive
suppression-only expectation.  ALICE interprets this as evidence for
J/ψ regeneration: the large charm quark density in the QGP at LHC
energies allows cc̄ pairs to recombine into J/ψ at the QGP phase
boundary.  Regeneration is strongest at low p_T (thermal recombination
produces slow J/ψ) and partially compensates colour-Debye screening,
resulting in a suppression that is weaker at low p_T than at high p_T.
"""

